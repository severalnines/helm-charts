name: Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Lint
        run: |-
          helm lint charts/*

  clustercontrol-upgrade-values:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.19.0, v4.1.3]
    steps:
      - uses: actions/checkout@v3
      - uses: azure/setup-helm@v3
        with:
          version: ${{ matrix.helm }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: helm dependency build charts/clustercontrol
      - run: python3 -m unittest discover -s charts/clustercontrol/tests -v
