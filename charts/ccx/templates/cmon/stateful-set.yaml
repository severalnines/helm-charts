{{- $isFile := eq .Values.cmon.secretStorageEngine "file" -}}
{{- $isK8s := eq .Values.cmon.secretStorageEngine "k8s" -}}
{{- $migrateFromK8s := and $isFile .Values.cmon.migrateFromK8s -}}
{{- $migrateFromFile := and $isK8s .Values.cmon.migrateFromFile -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cmon
  labels:
    app: cmon
    run: cmon
spec:
  selector:
    matchLabels:
      app: cmon
      run: cmon
  replicas: 1
  serviceName: cmon-pool
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9954"
        # cmon runs as a single replica whose PVCs are pinned to one zone, so a
        # scale-down cannot move it. Without this the autoscaler drains the node
        # anyway - it sizes nodes by requests, and cmon's are far below what it
        # actually uses.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        config: {{ include (print $.Template.BasePath "/cmon/secrets.yaml") . | sha256sum }}
      labels:
        app: cmon
        run: cmon
    spec:
      {{- if .Values.ccx.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.ccx.imagePullSecret }}
      {{- end }}
      initContainers:
        {{- if $migrateFromFile }}
        {{- include "cmon.initContainer.migrateToK8s" . | nindent 8 }}
        {{- end }}
        {{- if $migrateFromK8s }}
        {{- include "cmon.initContainer.restoreFromK8s" . | nindent 8 }}
        {{- end }}
        - name: init-cmon
          image: {{ .Values.cmon.image | required ".Values.cmon.image is missing" }}
          imagePullPolicy: Always
        {{- if .Values.cmon.coreDumpEnable }}
          securityContext:
            privileged: true
        {{- end }}
          command: [ "/bin/sh", "-c" ]
          args:
            - cp /tmp/cmon.cnf /etc/cmon.cnf;
              /usr/bin/check-cmon.sh;
              echo "Starting database upgrade";
              /usr/sbin/cmon -u;
              echo "Finishing database upgrade";
          {{- if .Values.cmon.coreDumpEnable }}
              sysctl -w kernel.core_pattern=/etc/cmon.d/core.%h.%e.%p.%t;
          {{- end }}
          volumeMounts:
            - mountPath: /tmp/cmon.cnf
              subPath: cmon.cnf
              name: cmon-cnf-cfg
          {{- if $isFile }}
            - mountPath: /etc/cmon.d
              name: cmon-master-pv
          {{- end }}
      containers:
        - name: cmon
          image: {{ .Values.cmon.image | required ".Values.cmon.image is missing" }}
          command: [ '/bin/sh', '-c' ]
          args:
            - >-
              hostname $(POD_NAME).cmon-pool &&
              {{- if .Values.cmon.coreDumpEnable }}
              ulimit -c unlimited &&
              {{- end }}
              exec /usr/sbin/cmon
              --k8s
              --secret-storage-engine={{ .Values.cmon.secretStorageEngine | default "k8s" }}
              --mysql-connect-retries 5
              --events-client http://ccx-stores-listener-svc:18097/cmon-events/{{ .Values.cmon.id }}
              -b 0.0.0.0
              -s
              -d
              {{- with .Values.cmon.extra_args }}
              {{ range . }}{{ . }} {{ end }}
              {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            privileged: True
          ports:
            - containerPort: 9501
              protocol: TCP
              name: cmon9501
            - containerPort: 9500
              protocol: TCP
              name: cmon9500
          volumeMounts:
            - mountPath: /etc/cmon.cnf
              subPath: cmon.cnf
              name: cmon-cnf-cfg
            - mountPath: /root/.s9s/s9s.conf
              subPath: s9s.conf
              name: s9s-cnf-cfg
          {{- if $isFile }}
            - mountPath: /etc/cmon.d
              name: cmon-master-pv
            - mountPath: /var/lib/cmon
              name: cmon-pv-var-lib-cmon
          {{- end }}
          {{- if .Values.cmon.license }}
            - mountPath: /root/.s9s/cmon-license
              name: cmon-license
          startupProbe:
            exec:
              command: [ 'sh', '-c', 'cat /root/.s9s/cmon-license/license | s9s --controller=https://localhost:9501 tree --save .runtime/cmon_license' ]
            timeoutSeconds: 10
            failureThreshold: 10
            periodSeconds: 5
          {{- end }}
          livenessProbe:
            httpGet:
              path: /v2/controller?operation=ping
              port: 9501
              scheme: HTTPS
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v2/controller?operation=ping
              port: 9501
              scheme: HTTPS
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.cmon.resources | nindent 12 }}
        - name: cmon-ssh
          image: {{ .Values.cmon.sshImage | default .Values.cmon.image | required ".Values.cmon.image is missing" }}
          {{- /* cmon-ssh flags mirror the cmon container: --k8s only in k8s mode.
                 --pool is intentionally omitted for now and will be re-enabled
                 together with cmon --pool in a later release. */}}
          command:
            - /usr/sbin/cmon-ssh
            {{- if $isK8s }}
            - --k8s
            {{- end }}
          imagePullPolicy: {{ .Values.cmon.sshImagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 9511
              protocol: TCP
              name: cmon-ssh9511
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
        {{- if $isFile }}
          volumeMounts:
            - mountPath: /etc/cmon.d
              name: cmon-master-pv
        {{- end }}
        - name: cmon-exporter
          image: {{ .Values.cmon.exporter.image | required ".Values.cmon.exporter.image is missing" }}
          ports:
            - containerPort: 9954
              protocol: TCP
              name: cmon-exp9954
          env:
            - name: CMON_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cmon-credentials
                  key: cmon-user
                  optional: false
            - name: CMON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmon-credentials
                  key: cmon-password
                  optional: false
        {{- if $isFile }}
          volumeMounts:
            - mountPath: /etc/cmon.d
              name: cmon-master-pv
        {{- end }}
          resources:
            {{- toYaml .Values.cmon.exporter.resources | nindent 12 }}
      volumes:
        - name: cmon-cnf-cfg
          secret:
            secretName: cmon-cnf
        - name: cmon-license
          secret:
            secretName: cmon-license
            optional: true
        - name: s9s-cnf-cfg
          secret:
            secretName: s9s-conf
      {{- if or $isFile $migrateFromFile }}
        - name: cmon-master-pv
          persistentVolumeClaim:
            claimName: cmon-master-volume
        - name: cmon-pv-var-lib-cmon
          persistentVolumeClaim:
            claimName: cmon-var-lib-cmon
      {{- end }}
      {{ with .Values.cmon.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.cmon.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.cmon.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{ end }}
