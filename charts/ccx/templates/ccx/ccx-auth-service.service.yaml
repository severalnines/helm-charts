apiVersion: v1
kind: Service
metadata:
  name: ccx-auth-service-svc
  labels:
    app: ccx-auth-service
    run: ccx-auth-service
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: ccx-auth-service
  ports:
    - protocol: TCP
      port: 5050
      targetPort: 5050
