apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-metrics-sd
  labels:
    app: store-metrics-sd
    run: store-metrics-sd
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.global.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: store-metrics-sd
      run: store-metrics-sd
  template:
    metadata:
      labels:
        app: store-metrics-sd
        run: store-metrics-sd
    spec:
      {{- if .Values.ccx.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.ccx.imagePullSecret }}
      {{- end }}
      {{- include "ccx.backend.podSecurityContext" . | nindent 6 }}
      containers:
        - name: store-metrics-sd
          image: {{ .Values.ccx.backend.image | required "No image set for backend" }}
          command: [ "/bin/metrics-sd" ]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INGRESS_HOST
              value: {{ include "ccx.ccxFQDN" . }}
          envFrom:
            - secretRef:
                name: db
          ports:
            - name: service
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.ccx.services.store_metrics_sd.resources | nindent 12 }}
          {{- include "ccx.backend.containerSecurityContext" . | nindent 10 }}