apiVersion: v1
kind: Service
metadata:
  name: ccx-user-svc
  labels:
    app: ccx-user
    run: ccx-user
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: ccx-user
  ports:
    - protocol: TCP
      port: 3030
      targetPort: 3030
