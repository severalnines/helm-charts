apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-admin-config-js
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  {{- end }}
data:
  config.js: |
    window.FEAS_ENV = {
    {{- range $key, $val := .Values.ccx.env }}
      {{- if hasPrefix "FE_" $key }}
        {{ $newKey := trimPrefix "FE_" $key }}
        {{ $newKey }}: {{ $val | quote }},
      {{- end }}
    {{- end }}

    {{- range $key, $val := .Values.ccx.services.uiadmin.env }}
      {{- if hasPrefix "FE_" $key }}
        {{ $newKey := trimPrefix "FE_" $key }}
        {{ $newKey }}: {{ $val | quote }},
      {{- end }}
    {{- end }}

    };