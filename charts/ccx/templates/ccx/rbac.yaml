{{ if .Values.ccx.createRBAC }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin
  annotations:
    {{- include "ccx.syncWave" (dict "root" . "wave" "-3") | nindent 4 }}
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "1"
rules:
- apiGroups: ["*", ""]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-binding
  annotations:
    {{- include "ccx.syncWave" (dict "root" . "wave" "-3") | nindent 4 }}
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "1"
subjects:
- kind: ServiceAccount
  name: default
roleRef:
  kind: Role
  name: admin
  apiGroup: rbac.authorization.k8s.io
{{ end }}