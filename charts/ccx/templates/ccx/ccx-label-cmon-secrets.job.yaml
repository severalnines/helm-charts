{{- if eq .Values.cmon.secretStorageEngine "k8s" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ccx-label-cmon-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ccx-label-cmon-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ccx-label-cmon-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: ccx-label-cmon-secrets
roleRef:
  kind: Role
  name: ccx-label-cmon-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ccx-label-cmon-secrets
  labels:
    app: ccx-label-cmon-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: ccx-label-cmon-secrets
    spec:
    {{- with .Values.cmon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.cmon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.cmon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      restartPolicy: Never
      serviceAccountName: ccx-label-cmon-secrets
      {{- if .Values.ccx.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.ccx.imagePullSecret }}
      {{- end }}
      containers:
        - name: ccx-label-cmon-secrets
          image: alpine/k8s:1.32.2
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              LABEL_KEY="com.severalnines.cmon"
              LABEL_VALUE="true"
              PATTERN='^secret/com\.severalnines\.cmon\.etc\.cmon\.d\.cmon-'

              echo "Looking for cmon config secrets in namespace ${NAMESPACE}..."
              kubectl get secrets -n "$NAMESPACE" -o name | grep -E "$PATTERN" > /tmp/matches.txt || true

              if [ ! -s /tmp/matches.txt ]; then
                echo "No matching secrets found - nothing to label (cmon may not be using k8s Secrets for storage here)."
                exit 0
              fi

              while read -r res; do
                name="${res#secret/}"
                if kubectl label secret "$name" -n "$NAMESPACE" "${LABEL_KEY}=${LABEL_VALUE}" 2>/tmp/label-err.log; then
                  echo "  labeled ${name}"
                elif grep -q "already has a value" /tmp/label-err.log; then
                  echo "  already labeled, skipping ${name}"
                else
                  echo "  ERROR labeling ${name}:"
                  cat /tmp/label-err.log
                  exit 1
                fi
              done < /tmp/matches.txt

              echo "Done."
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
