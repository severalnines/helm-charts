apiVersion: v1
kind: Service
metadata:
  name: ccx-ui-app-svc
  labels:
    app: ccx-ui-app
    run: ccx-ui-app
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: ccx-ui-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
