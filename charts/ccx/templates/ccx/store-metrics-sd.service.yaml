apiVersion: v1
kind: Service
metadata:
  name: store-metrics-sd-svc
  labels:
    app: store-metrics-sd
    run: store-metrics-sd
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: store-metrics-sd
    run: store-metrics-sd
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
