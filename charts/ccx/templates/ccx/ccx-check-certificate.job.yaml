apiVersion: batch/v1
kind: Job
metadata:
  name: ccx-check-certificate-authority
  annotations:
    {{- include "ccx.syncWave" (dict "root" . "wave" "0") | nindent 4 }}
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "555"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 432000
  backoffLimit: 0
  template:
    spec:
      {{- if .Values.ccx.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.ccx.imagePullSecret }}
      {{- end }}
      restartPolicy: Never
      {{- include "ccx.backend.podSecurityContext" . | nindent 6 }}
      containers:
        - name: check-certificate-authority
          image: {{ .Values.ccx.services.stores_service.image | default .Values.ccx.backend.image | required "No image set for stores" }}
          command: ["/bin/ccx-stores", "check-certificate-authority"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $key, $val := .Values.ccx.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: ccx
                optional: true
          {{- include "ccx.backend.containerSecurityContext" . | nindent 10 }}
      {{- with .Values.ccx.services.stores_service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ccx.services.stores_service.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ccx.services.stores_service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
