apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-internal-metrics-sd
  labels:
    app: store-internal-metrics-sd
    run: store-internal-metrics-sd
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.global.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: store-internal-metrics-sd
      run: store-internal-metrics-sd
  template:
    metadata:
      labels:
        app: store-internal-metrics-sd
        run: store-internal-metrics-sd
      annotations:
        checksum: {{ include (print $.Template.BasePath "/ccx/secrets.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/ccx/config.yaml") . | sha256sum }}
    spec:
      {{- include "ccx.backend.podSecurityContext" . | nindent 6 }}
      containers:
        - name: store-internal-metrics-sd
          image: {{ .Values.ccx.backend.image | required "No image set for backend" }}
          command: [ "/bin/internal-metrics-sd" ]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: ccx
            - secretRef:
                name: db
          ports:
            - name: service
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.ccx.services.store_internal_metrics_sd.resources | nindent 12 }}
          {{- include "ccx.backend.containerSecurityContext" . | nindent 10 }}