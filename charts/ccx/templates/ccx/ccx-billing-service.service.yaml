apiVersion: v1
kind: Service
metadata:
  name: ccx-billing-svc
  labels:
    app: ccx-billing-service
    run: ccx-billing-service
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: ccx-billing-service
  ports:
    - protocol: TCP
      port: 20003
      targetPort: 20003
