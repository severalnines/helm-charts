apiVersion: v1
kind: Service
metadata:
  name: ccx-rest-admin-svc
  labels:
    app: ccx-rest-admin-service
    run: ccx-rest-admin-service
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: ccx-rest-admin-service
  ports:
    - protocol: TCP
      port: 20001
      targetPort: 20001
