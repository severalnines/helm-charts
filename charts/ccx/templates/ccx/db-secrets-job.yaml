{{- if not (include "ccx.hasClusterAccess" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ccx-create-db-secrets
  annotations:
    {{- include "ccx.syncWave" (dict "root" . "wave" "-2") | nindent 4 }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "111"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
      - name: create-secrets
        image: bitnami/kubectl:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

          if [ -n "$DB_PASSWORD" ]; then
            PASSWORD="$DB_PASSWORD"
            USERNAME="$DB_USERNAME"
          else
            echo "Waiting for postgres operator secret..."
            until kubectl get secret ccx.acid-ccx.credentials.postgresql.acid.zalan.do -n "$NS" >/dev/null 2>&1; do sleep 3; done
            PASSWORD=$(kubectl get secret ccx.acid-ccx.credentials.postgresql.acid.zalan.do -n "$NS" -o jsonpath='{.data.password}' | base64 -d)
            USERNAME=$(kubectl get secret ccx.acid-ccx.credentials.postgresql.acid.zalan.do -n "$NS" -o jsonpath='{.data.username}' | base64 -d)
          fi

          for entry in "db:ccx" "db-backup:ccx_backup" "db-user:userdb" "db-deployer:ccx_deployer" "db-notification:ccx_notification" "db-projects:ccx_projects" "db-vpc:ccx_vpc"; do
            SECRET_NAME="${entry%%:*}"
            DB_NAME="${entry##*:}"
            DSN="postgres://${USERNAME}:${PASSWORD}@{{ include "ccx.db.address" . }}:{{ include "ccx.db.port" . }}/${DB_NAME}?sslmode=disable"
            kubectl create secret generic "$SECRET_NAME" \
              --from-literal=DB_DSN="$DSN" \
              --namespace="$NS" \
              --dry-run=client -o yaml | kubectl apply -f -
          done
          echo "All db secrets created."
        env:
        {{- if .Values.ccx.db.password }}
        - name: DB_PASSWORD
          value: {{ .Values.ccx.db.password | quote }}
        - name: DB_USERNAME
          value: {{ .Values.ccx.db.username | default "ccx" | quote }}
        {{- end }}
{{- end }}
