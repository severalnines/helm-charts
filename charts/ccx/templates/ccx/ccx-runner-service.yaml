apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccx-runner-service
  labels:
    app: ccx-runner-service
    run: ccx-runner-service
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.ccx.services.runner.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: ccx-runner-service
      run: ccx-runner-service
  template:
    metadata:
      labels:
        app: ccx-runner-service
        run: ccx-runner-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        checksum: {{ include (print $.Template.BasePath "/ccx/secrets.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/ccx/config.yaml") . | sha256sum }}
        checksum/core: {{ include (print $.Template.BasePath "/ccx/ccx-config-core.yaml") . | sha256sum }}
        checksum/fluentbit: {{ include (print $.Template.BasePath "/ccx/ccx-fluentbit-config.yaml") . | sha256sum }}
    spec:
      {{- if .Values.ccx.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.ccx.imagePullSecret }}
      {{- end }}
      terminationGracePeriodSeconds: 3600
      {{- include "ccx.backend.podSecurityContext" . | nindent 6 }}
      containers:
        - name: ccx-runner-service
          image: {{ .Values.ccx.services.runner.image | default .Values.ccx.backend.image | required "No image set for runner" }}
          command: ["/bin/ccx-stores", "runner"]
          env:
            - name: CONFIG_FILE
              value: "/conf/ccx.yaml"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADDR
              value: "0.0.0.0:20002"
            - name: BACKUPS_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: db-backup
                  key: DB_DSN
            - name: DEPLOYER_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: db-deployer
                  key: DB_DSN
            - name: VPCS_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: db-vpc
                  key: DB_DSN
          {{- range $key, $val := .Values.ccx.services.runner.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- range $key, $val := .Values.ccx.services.stores_service.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- range $key, $val := .Values.ccx.services.backupstorage.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- range $key, $val := .Values.ccx.services.datastorestorage.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- range $key, $val := .Values.ccx.services.deployer.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: ccx
            - secretRef:
                name: cmon-credentials
            - secretRef:
                name: db
            {{- range $name := .Values.ccx.cloudSecrets }}
            - secretRef:
                name: {{ $name }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: conf-core
              mountPath: "/conf/ccx.yaml"
              subPath: "ccx.yaml"
            {{- if .Values.fluentbit.enabled }}
            - name: conf-fluentbit
              mountPath: "/conf/fluent-bit.conf"
              subPath: "fluent-bit.conf"
            - name: conf-fluentbit
              mountPath: "/conf/parsers-multiline.conf"
              subPath: "parsers-multiline.conf"
            {{- end }}
            {{- if and .Values.fluentbit.enabled .Values.fluentbit.extraOutputConfig }}
            - name: conf-fluentbit
              mountPath: "/conf/extra_output.conf"
              subPath: "extra-output.conf"
            {{- end }}
            {{- range .Values.ccx.services.stores_service.extraVolumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              subPath: {{ .subPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.ccx.services.runner.resources | nindent 12 }}
          {{- include "ccx.backend.containerSecurityContext" . | nindent 10 }}
      volumes:
        - name: conf-core
          configMap:
            name: ccx-config-core
        {{- if .Values.fluentbit.enabled }}
        - name: conf-fluentbit
          configMap:
            name: ccx-configmap-fluentbit
        {{- end }}
        {{- range .Values.ccx.services.stores_service.extraVolumes }}
        {{- if not .name }}{{ fail "extraVolumes: each entry must have a 'name'" }}{{- end }}
        {{- if and .secret .configMap }}{{ fail (printf "extraVolumes entry '%s': specify exactly one of 'secret' or 'configMap', not both" .name) }}{{- end }}
        {{- if not (or .secret .configMap) }}{{ fail (printf "extraVolumes entry '%s': must specify exactly one of 'secret' or 'configMap'" .name) }}{{- end }}
        - name: {{ .name }}
          {{- if .secret }}
          secret:
            secretName: {{ .secret }}
          {{- else }}
          configMap:
            name: {{ .configMap }}
          {{- end }}
        {{- end }}
      {{ with .Values.ccx.services.runner.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.ccx.services.runner.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.ccx.services.runner.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{ end }}
