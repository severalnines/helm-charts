                enum:
                - direct
                - gitops
                - auto
                type: string
              dependsOn:
                items:
                  properties:
                    healthChecks:
                      items:
                        properties:
                          condition:
                            type: string
                          object:
                            description: ObjectRef points to a namespaced or cluster-scoped
                              object
                            properties:
                              apiVersion:
                                type: string
                              kind:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            type: object
                          type:
                            type: string
                        type: object
                      type: array
                    name:
                      type: string
                    namespace:
                      type: string
                    resolver:
                      description: |-
                        Resolver optionally defines how to detect if this dependency is already satisfied in the cluster.
                        If set, this is evaluated before translation/apply to decide whether to skip creating this dependency.
                        This is different from healthChecks which are about post-apply readiness.
                      properties:
                        checks:
                          items:
                            description: |-
                              DependencyCheckSpec describes a single detection check.
                              Only one of APIGroup, CRD, or Resource should typically be set per check.
                            properties:
                              apiGroup:
                                description: APIGroup is considered satisfied if the
                                  given API group exists on the server, e.g. "cert-manager.io".
                                type: string
                              crd:
                                description: CRD is considered satisfied if the given
                                  CRD (by plural.name.group) exists, e.g. "certificates.cert-manager.io".
                                type: string
                              resource:
                                description: Resource checks for existence/condition
                                  on a specific object.
                                properties:
                                  apiVersion:
                                    type: string
                                  kind:
                                    type: string
                                  name:
                                    type: string
                                  namespace:
                                    type: string
                                type: object
                            type: object
                          type: array
                        mode:
                          type: string
                      type: object
                    shared:
                      type: boolean
                    source:
                      properties:
                        git:
                          properties:
                            include:
                              type: string
                            path:
                              type: string
                            recurse:
                              type: boolean
                            ref:
                              type: string
                            url:
                              type: string
                          required:
                          - path
                          - ref
                          - url
                          type: object
                        helm:
                          properties:
                            chart:
                              type: string
                            repoURL:
                              type: string
                            values:
                              x-kubernetes-preserve-unknown-fields: true
                            valuesFrom:
                              items:
                                properties:
                                  key:
                                    type: string
                                  kind:
                                    enum:
                                    - Secret
                                    - ConfigMap
                                    type: string
                                  name:
                                    type: string
                                  optional:
                                    type: boolean
                                required:
                                - key
                                - kind
                                - name
                                type: object
                              type: array
                            version:
                              type: string
                          required:
                          - chart
                          - repoURL
                          type: object
                        kind:
                          enum:
                          - helm
                          - git
                          - oci
                          type: string
                        oci:
                          properties:
                            path:
                              type: string
                            ref:
                              type: string
                            url:
                              type: string
                          required:
                          - ref
                          - url
                          type: object
                      required:
                      - kind
                      type: object
                  type: object
                type: array
              destination:
                properties:
                  kubeconfigSecretRef:
                    type: string
                  name:
                    type: string
                  server:
                    type: string
                type: object
              driftDetection:
                type: string
              gitOps:
                description: 'Deprecated: retained for upgrade safety. DeliveryConfig
                  owns routing.'
                properties:
                  baseBranch:
                    type: string
                  basePath:
                    description: |-
                      BasePath specifies the directory in the repo where the root Application should point.
                      All file paths are computed deterministically from BasePath and resource shape.
                    type: string
                  baseURL:
                    type: string
                  clusterID:
                    type: string
                  credentialsRef:
                    description: |-
                      GitOpsCredentialsRef references a Secret that contains credentials for VCS hosting
                      If Namespace is empty, the DeliveryConfig namespace is used. If Key is empty, "token" is assumed.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  repoURL:
                    type: string
                  reviewers:
                    items:
                      type: string
                    type: array
                  vcs:
                    enum:
                    - github
                    type: string
                required:
                - repoURL
                type: object
              gitOpsFrom:
                description: 'Deprecated: retained for upgrade safety. Set spec.delivery.configRef
                  instead.'
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                type: object
              interval:
                type: string
              manageLifecycle:
                default: false
                description: |-
                  ManageLifecycle determines if the controller should reconcile/apply resources for this AppBundle.
                  If false, the controller will not apply changes (useful for imported bundles).
                type: boolean
              provider:
                description: AppBundleProvider indicates which controller provider
                  to emit
                enum:
                - argo
                - flux
                - auto
                type: string
              prune:
                type: boolean
              releaseName:
                type: string
              renderer:
                description: AppBundleRenderer defines how to render git/oci sources
                enum:
                - auto
                - kustomize
                - raw
                type: string
              serviceAccountName:
                type: string
              source:
                properties:
                  git:
                    properties:
                      include:
                        type: string
                      path:
                        type: string
                      recurse:
                        type: boolean
                      ref:
                        type: string
                      url:
                        type: string
                    required:
                    - path
                    - ref
                    - url
                    type: object
                  helm:
                    properties:
                      chart:
                        type: string
                      repoURL:
                        type: string
                      values:
                        x-kubernetes-preserve-unknown-fields: true
                      valuesFrom:
                        items:
                          properties:
                            key:
                              type: string
                            kind:
                              enum:
                              - Secret
                              - ConfigMap
                              type: string
                            name:
                              type: string
                            optional:
                              type: boolean
                          required:
                          - key
                          - kind
                          - name
                          type: object
                        type: array
                      version:
                        type: string
                    required:
                    - chart
                    - repoURL
                    type: object
                  kind:
                    enum:
                    - helm
                    - git
                    - oci
                    type: string
                  oci:
                    properties:
                      path:
                        type: string
                      ref:
                        type: string
                      url:
                        type: string
                    required:
                    - ref
                    - url
                    type: object
                required:
                - kind
                type: object
              sync:
                properties:
                  allowEmpty:
                    description: |-
                      AllowEmpty permits syncing applications that have zero resources.
                      Useful for root app-of-apps when the GitOps repo might be empty.
                    type: boolean
                  createNamespace:
                    type: boolean
                  prunePropagationPolicy:
                    type: string
                  replaceOnConflicts:
                    type: boolean
                  retry:
                    properties:
                      backoff:
                        properties:
                          duration:
                            type: string
                          factor:
                            format: int32
                            type: integer
                          maxDuration:
                            type: string
                        type: object
                      limit:
                        format: int32
                        type: integer
                    type: object
                  serverSideApply:
                    type: boolean
                  skipDryRunOnMissingResource:
                    type: boolean
                type: object
              target:
                description: |-
                  Target carries the unified workload-namespace address
                  (spec.target.namespace). When set it takes precedence over the
                  deprecated spec.targetNamespace.
                properties:
                  namespace:
                    description: Namespace is the workload namespace this intent addresses.
                    type: string
                type: object
              targetNamespace:
                description: |-
                  TargetNamespace is the workload namespace the bundle installs into.

                  Deprecated: use spec.target.namespace.
                type: string
              useServiceAccountAsArgoClusterCred:
                type: boolean
            required:
            - source
            - targetNamespace
            type: object
          status:
            description: AppBundleStatus defines minimal observed state
            properties:
              conditions:
                description: Conditions expresses high-level status such as Ready,
                  Progressing, Degraded
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              delivery:
                description: Delivery reports convergence independently of workload
                  health.
                properties:
                  approval:
                    description: DeliveryApproval carries a generic approval reference,
                      not provider fields.
                    properties:
                      kind:
                        type: string
                      ref:
                        type: string
                      url:
                        type: string
                    type: object
                  bundles:
                    items:
                      description: |-
                        DeliveryBundleStatus preserves every outcome; a successful sibling cannot
                        hide a pending approval, failed delivery or unavailable observation.
                      properties:
                        address:
                          type: string
                        approval:
                          description: DeliveryApproval carries a generic approval
                            reference, not provider fields.
                          properties:
                            kind:
                              type: string
                            ref:
                              type: string
                            url:
                              type: string
                          type: object
                        contentDigest:
                          type: string
                        lastDeliveredAt:
                          format: date-time
                          type: string
                        medium:
                          type: string
                        message:
                          type: string
                        owner:
                          description: DeliveryOwner identifies the producer revision,
                            independently of a strategy.
                          properties:
                            apiVersion:
                              type: string
                            generation:
                              format: int64
                              type: integer
                            kind:
                              type: string
                            name:
                              type: string
                            namespace:
                              type: string
                            uid:
                              description: |-
                                UID is a type that holds unique ID values, including UUIDs.  Because we
                                don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                intent and helps make sure that UIDs and names do not get conflated.
                              type: string
                          type: object
                        state:
                          description: DeliveryState describes convergence of the
                            current intent, not the last write.
                          type: string
                        target:
                          type: string
                        throttle:
                          properties:
                            reason:
                              type: string
                            until:
                              format: date-time
                              type: string
                          type: object
                        waitingOn:
                          type: string
                      required:
                      - address
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - address
                    x-kubernetes-list-type: map
                  lastDeliveredAt:
                    format: date-time
                    type: string
                  medium:
                    type: string
                  state:
                    description: DeliveryState describes convergence of the current
                      intent, not the last write.
                    type: string
                  throttle:
                    properties:
                      reason:
                        type: string
                      until:
                        format: date-time
                        type: string
                    type: object
                  waitingOn:
                    type: string
                type: object
              gateway:
                description: Gateway reports endpoints owned by this application,
                  independently of health.
                properties:
                  endpoints:
                    description: Endpoints records one stable gateway allocation per
                      exposed endpoint.
                    items:
                      description: DatabaseGatewayEndpointStatus describes one client
                        endpoint allocation.
                      properties:
                        listenerName:
                          type: string
                        listenerPort:
                          description: |-
                            ListenerPort is the gateway listener port. For a NodePort gateway, use
                            the gateway API's mapped node port when building an external address.
                          format: int32
                          type: integer
                        member:
                          default: ""
                          description: Member identifies a dynamic endpoint member;
                            empty for singleton endpoints.
                          type: string
                        message:
                          type: string
                        name:
                          description: Name is the provider endpoint name (for example
                            primary or member).
                          type: string
                        ready:
                          description: Ready reports observed route readiness, not
                            database health.
                          type: boolean
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    - member
                    x-kubernetes-list-type: map
                  gatewayName:
                    description: |-
                      GatewayName is the shared Gateway this database's listener attaches to
                      (e.g. "cc-gateway").
                    type: string
                  gatewayNamespace:
                    description: |-
                      GatewayNamespace is the namespace of the shared Gateway
                      (e.g. "envoy-gateway-system").
                    type: string
                  gatewayPresent:
                    description: |-
                      GatewayPresent records whether the shared Gateway object
                      (gatewayName/gatewayNamespace) existed at the last reconcile. The
                      translators emit the ListenerSet/TCPRoute only while it is true: a
                      route whose parent Gateway does not exist is claimed by no controller,
                      never gets a status.parents verdict, and wedges GitOps delivery for
                      the whole environment (CLUS-8512). The listener port above stays
                      allocated (sticky) while this is false; emission resumes automatically
                      on the reconcile after the Gateway appears. False also while the
                      Gateway API CRDs are unregistered (no gateway addon — nothing to
                      attach to either way).
                    type: boolean
                  hostname:
                    description: Hostname is the configured public gateway DNS name,
                      when available.
                    type: string
                type: object
              lastAppliedManifestsCount:
                description: LastAppliedManifestsCount shows how many objects the
                  last translation emitted
                format: int32
                type: integer
              lastReconciledTime:
                description: LastReconciledTime captures last reconciliation timestamp
                format: date-time
                type: string
              managedRefs:
                description: ManagedRefs lists objects created/managed by this AppBundle
                  translation
                items:
                  description: ObjectRef points to a namespaced or cluster-scoped
                    object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the last reconciled generation
                format: int64
                type: integer
              phase:
                type: string
              providerManagedRefs:
                description: ProviderManagedRefs captures objects reported by the
                  underlying delivery provider (e.g. Argo inventory)
                items:
                  description: ObjectRef points to a namespaced or cluster-scoped
                    object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  type: object
                type: array
              providerSummary:
                additionalProperties:
                  type: string
                description: ProviderSummary contains tool-specific summary fields
                  (e.g., sync/health for Argo; ready for Flux)
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
