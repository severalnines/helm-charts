---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: appbundles.agent.severalnines.com
spec:
  group: agent.severalnines.com
  names:
    kind: AppBundle
    listKind: AppBundleList
    plural: appbundles
    singular: appbundle
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.targetNamespace
      name: TargetNS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AppBundle is the Schema for the AppBundle API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppBundleSpec defines the desired state of AppBundle
            properties:
              deletionPolicy:
                description: AppBundleDeletionPolicy controls behavior on delete
                enum:
                - Delete
                - WaitForTermination
                - Orphan
                type: string
              delivery:
                description: Delivery optionally overrides destination selectors for
