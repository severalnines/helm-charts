{{- if .Values.rbac.create }}
{{- $opNs := include "agent-operator.namespace" . }}
{{- $targets := .Values.rbac.namespaces.targets | default (list) }}
{{- range $ns := $targets }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s9s-read-extra
  namespace: {{ $ns }}
  labels:
    {{- include "agent-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: s9s:cluster-read-extra
subjects:
- kind: ServiceAccount
  name: {{ $.Values.rbac.serviceAccounts.agent.name }}
  namespace: {{ $opNs }}
{{- if $.Values.mode.write.enabled }}
- kind: ServiceAccount
  name: {{ $.Values.rbac.serviceAccounts.write.name }}
  namespace: {{ $opNs }}
{{- end }}
{{- if not $.Values.mode.write.enabled }}
{{/*
  A managed namespace is managed: write is granted here, scoped to this
  namespace. Restricted mode means no CLUSTER-WIDE write (no
  ClusterRoleBinding — see rolebinding-cluster-write.yaml); it does not mean
  the namespaces the operator explicitly listed become read-only.

  The pod runs as the plain agent SA whenever write mode is off (see
  deployment.yaml serviceAccountName), so the grant goes to that SA.

  This was gated on `mode.write.enabled` — the inverse — which made it
  useless both ways: absent exactly when it was the point, and redundant
  when present, since the cluster-wide binding already covered the write SA.
  Selecting "Managed namespaces" without cluster-wide write therefore
  granted read only, contradicting that checkbox's own help text. Observed
  on cc-c7411t: n1 and n2 carried s9s-read-extra and nothing else.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s9s-write
  namespace: {{ $ns }}
  labels:
    {{- include "agent-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: s9s:cluster-write
subjects:
- kind: ServiceAccount
  name: {{ $.Values.rbac.serviceAccounts.agent.name }}
  namespace: {{ $opNs }}
{{- end }}
{{- end }}
{{- end }}
