{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s9s:cluster-read
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Read-only view of RBAC grants so the UI can badge namespace access
  # (s9s-read-extra RoleBindings) — CLUS-7411 namespace-access visibility.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agent.severalnines.com"]
    resources:
      [
        "databaseclusters",
        "databaseoperators",
        "databasebackups",
        "databasebackupschedules",
        "appbundles",
        "clusterchangerequests",
        "databaseclusters/status",
        "databaseoperators/status",
        "databasebackups/status",
        "databasebackupschedules/status",
        "appbundles/status",
        "clusterchangerequests/status",
        "databaseclusters/finalizers",
        "databaseoperators/finalizers",
        "databasebackups/finalizers",
        "databasebackupschedules/finalizers",
        "appbundles/finalizers",
        "clusterchangerequests/finalizers"
      ]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      [
        "configmaps",
        "services",
        "persistentvolumeclaims",
        "events",
        "pods",
        "pods/log",
        "namespaces",
        "nodes"
      ]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["moco.cybozu.com"]
    resources:
      ["mysqlclusters", "mysqlbackups", "mysqlbackuppolicies", "backuppolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pxc.percona.com"]
    resources:
      [
        "perconaxtradbclusters",
        "perconaxtradbbackups",
        "perconaxtradbbackupjobs",
        "perconaxtradbrestores"
      ]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stackgres.io"]
    resources: ["sgclusters", "sgbackups", "sgbackupconfigs", "sgschedules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["elasticsearch.k8s.elastic.co"]
    resources: ["elasticsearches"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s9s:cluster-read-extra
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets", "serviceaccounts"]
  verbs: ["get", "list", "watch"]
---
# CLUS-7411: full verbs on the agent's OWN intent CRDs only — nothing else.
# No ClusterRoleBinding here: this role is bound per-namespace via the
# PR-carried grant (kit.BuildAgentIntentAdminRoleBinding, riding the same
# rbac/<ns>.yaml file/PR as s9s-read-extra) and ONLY for namespaces that
# already contain legacy intent CRs the agent cannot manage under restricted
# RBAC (pre-namespace-semantics CRs living outside the operator namespace —
# status/finalizer writes there are RoleBinding-bound). New deploys never get
# it: intent CRs land in the operator namespace, where s9s-write already
# binds s9s:cluster-write. Keep the resource list in sync with the
# agent.severalnines.com block of s9s:cluster-write below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s9s:intent-admin
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agent.severalnines.com"]
    resources:
      [
        "databaseclusters",
        "databaseoperators",
        "databasebackups",
        "databasebackupschedules",
        "appbundles",
        "clusterchangerequests",
        "databaseclusters/status",
        "databaseoperators/status",
        "databasebackups/status",
        "databasebackupschedules/status",
        "appbundles/status",
        "clusterchangerequests/status",
        "databaseclusters/finalizers",
        "databaseoperators/finalizers",
        "databasebackups/finalizers",
        "databasebackupschedules/finalizers",
        "appbundles/finalizers",
        "clusterchangerequests/finalizers",
      ]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s9s:cluster-write
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      [
        "configmaps",
        "secrets",
        "serviceaccounts",
        "services",
        "persistentvolumeclaims",
        "events",
        "namespaces",
      ]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["agent.severalnines.com"]
    resources:
      [
        "databaseclusters",
        "databaseoperators",
        "databasebackups",
        "databasebackupschedules",
        "appbundles",
        "clusterchangerequests",
        "databaseclusters/status",
        "databaseoperators/status",
        "databasebackups/status",
        "databasebackupschedules/status",
        "appbundles/status",
        "clusterchangerequests/status",
        "databaseclusters/finalizers",
        "databaseoperators/finalizers",
        "databasebackups/finalizers",
        "databasebackupschedules/finalizers",
        "appbundles/finalizers",
        "clusterchangerequests/finalizers",
      ]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["moco.cybozu.com"]
    resources:
      ["mysqlclusters", "mysqlbackups", "mysqlbackuppolicies", "backuppolicies"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create", "patch", "update", "delete"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["create", "patch", "update", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["create", "patch", "update", "delete"]

  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "update", "patch"]
{{- if .Values.sops.enabled }}
---
# CLUS-7183: SOPS GitOps-secrets pipeline.
# - unrestricted mode watches `corev1.Secret` cluster-wide (Pattern A trigger).
# - restricted mode MUST NOT receive cluster-wide plaintext Secret read. Until
#   Pattern A has per-granted-namespace informers, its startup capability gate
#   deliberately reports rbac_denied and leaves the watchers off.
# - periodic sweep lists `SopsSecret` cluster-wide and filters by source-name label.
# - observer/secret Gets `corev1.Secret` for WaitingOnSecretPR on parent reconcilers.
#
# All user-namespace access is READ-ONLY. The controller never writes
# `corev1.Secret`s in user namespaces — neither data nor metadata. Pattern A
# status surface lives on a CCR in the agent namespace (CCR-as-status), so
# no user-Secret update permission is required. The CCR get/create/update/
# delete verbs come from the write-mode role above (agent.severalnines.com /
# clusterchangerequests).
#
# CLUS-7411: the agent probes the full informer capability at startup via
# SelfSubjectAccessReview before wiring Pattern A. Restricted mode intentionally
# fails the cluster-wide Secret probes even though this role still grants the
# SopsSecret sweep capability. The watchers stay off — one WARN and
# kuber_sops_pattern_a_status=rbac_denied — rather than widening plaintext
# access or retrying Forbidden forever. Unrestricted mode renders every probed
# rule. Keep that mode in sync with sopsWatchProbes in sops_capability.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s9s:sops-pipeline
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
rules:
{{- if .Values.mode.write.enabled }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
{{- end }}
  - apiGroups: ["isindir.github.com"]
    resources: ["sopssecrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: s9s:sops-pipeline
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: s9s:sops-pipeline
subjects:
  - kind: ServiceAccount
    name: {{ if .Values.mode.write.enabled }}{{ .Values.rbac.serviceAccounts.write.name }}{{ else }}{{ .Values.rbac.serviceAccounts.agent.name }}{{ end }}
    namespace: {{ include "agent-operator.namespace" . }}
{{- end }}
{{- end }}
