# Default values for agent-operator
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Operator image configuration
image:
  repository: europe-docker.pkg.dev/severalnines-public/clustercontrol/kuber-agent
  tag: "" # Default tag is empty; deployment template will use Chart.AppVersion if not overridden
  pullPolicy: Always
  useDevelopmentImage: false # Set to true to use the developmentImageTag
  developmentImageTag: "main-dev-latest" # The tag for your 'latest' development build
  pullSecrets: [] # Optional list of imagePullSecrets, e.g. [{name: regcred}]


# Agent configuration
agent:
  # Public key for agent authentication
  publicKey: ""
  # Name for the agent (defaults to the node name if not set)
  name: ""

# Environment setting (determines default log level if debug.logLevel is not set)
env: production # Set to "development" for debug logging by default

# Namespace configuration
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
createNamespace: true

# Controller manager configuration
controllerManager:
  replicas: 1
  # Leader election guards against two managers acting at once. With a
  # single replica there is no second manager to guard against, and the
  # cost is real: controller-runtime EXITS when it cannot renew the lease,
  # so every transient API-server blip restarts the agent, drops its gRPC
  # stream to the proxy, and fails in-flight requests. Observed on
  # cc-test5: 43 restarts in 10 days, all "leader election lost".
  # Turn this on only when running more than one replica.
  leaderElect: false
  manager:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
  # Health probe configuration
  healthProbe:
    port: 8082

  # Optional: run only a subset of controllers. Empty = all
  # Valid: databasecluster, databaseoperator, databasebackupschedule, databasebackup, appbundle, gc
  controllers: []

# Dev overrides (command/startupProbe) - enabled via values
dev:
  enabled: false
  command: ["/usr/local/bin/devloop-operator.sh"]
  startupProbe:
    httpGet:
      path: /healthz
      port: 8082
    failureThreshold: 120
    periodSeconds: 2
  disableProbes: true
  persistentCache:
    enabled: true
    create: false
    pvcName: operator-cache
    storageClassName: local-path
  resources: {}

metrics:
  enabled: true
  port: 8081
  secure: false
  service:
    enabled: true
    type: ClusterIP
  serviceMonitor:
    # Rendered only when the Prometheus Operator CRDs are present in the
    # cluster (Argo re-render picks it up after the prometheus-stack addon
    # installs them). Set false to opt out of bundled-Prometheus scraping.
    enabled: true
    interval: 30s


rbac:
  create: true
  serviceAccounts:
    agent:
      name: agent-operator-controller-manager
      create: true
    write:
      name: agent-operator-controller-manager-write
      create: true
  clusterRead:
    includeSecrets: false      # when true, also bind s9s:cluster-read-extra per namespace
  # May the agent manage RBAC objects (Roles/RoleBindings), bounded by its own
  # privileges? (CLUS-8334.) Addons ship namespaced Role/RoleBinding
  # auxiliaries (e.g. the prometheus-stack grafana-admin-init Job's Role); in
  # direct-apply mode (gitops.enabled=false) the agent applies those itself,
  # which needs verbs on roles/rolebindings. GitOps mode does not need this —
  # Argo applies addon manifests.
  #
  # The grant (ClusterRole s9s:rbac-manage, bound to the write SA) is
  # cluster-wide but safety-bounded by Kubernetes RBAC escalation prevention:
  # it deliberately NEVER includes the `escalate` (or `bind`) verb, so the API
  # server only permits the agent to create/update a Role whose rules are a
  # subset of the permissions the agent already holds — in any namespace, the
  # agent cannot mint power it doesn't have. An auxiliary Role that needs more
  # than the agent holds fails Forbidden and surfaces as an InsufficientRBAC
  # PendingDependency condition on the addon's AppBundle: widening RBAC stays
  # a human decision, never a silent grant.
  #
  # Rendered only when mode.write.enabled=true (an "admin" install is expected
  # to be able to install addons). Set to false to opt out; addons whose
  # auxiliaries need RBAC writes then stay uninstalled with an explicit
  # condition unless delivered via GitOps.
  manageRbacObjects:
    enabled: true
  namespaces:
    targets: []            # e.g. ["app-a", "app-b"]
    create: false          # optionally create target namespaces

mode:
  write:
    enabled: false   # when true: bind agent-write SA to s9s:cluster-write cluster-wide

# Proxy configuration for connecting to ClusterControl server
proxy:
  grpcAddress: "host.docker.internal:50051"

# Debug settings
debug:
  logLevel: "" # Explicitly set log level (e.g., "debug", "info"). Overrides the default based on 'env'.

# Cleanup configuration
# Use: helm uninstall <release-name> --set cleanup.enabled=true
cleanup:
  # Enable comprehensive cleanup during helm uninstall
  # This will delete database clusters, operators, and CRDs in proper order
  enabled: false
  
  # Timeout for each cleanup phase (in seconds)
  timeoutSeconds: 300
  
  # Image to use for cleanup jobs (kubectl image)
  image:
    repository: bitnami/kubectl
    tag: "1.28"
    pullPolicy: IfNotPresent
  
  # Resource limits for cleanup jobs
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# GitOps integration (controllers must be installed separately; no bootstrapping here)
gitops:
  enabled: false
  # tool: "argo" | "flux"
  tool: "argo"
  argo:
    namespace: "argocd"
  flux:
    namespace: "flux-system"

# Prometheus monitoring (CLUS-7569). Two addons share this config block:
# `prometheus-stack` installs the upstream operator chart; `prometheus-agent`
# ships the PrometheusAgent CR that scrapes the cluster and remote_writes to
# a Prom the customer specifies (CC's cmon-side Prom by default).
# Spec: docs/observability/features/prometheus-agent.md.
prometheusStack:
  # Activates the `prometheus-community/kube-prometheus-stack` delivery addon.
  # By default it installs operator/CRDs only (the upstream standalone
  # prometheus-operator chart is deprecated, so the stack chart with
  # non-operator components disabled replaces it); bundled
  # Prometheus and Grafana are opt-in below.
  enabled: false
  # User runs Prometheus Operator/CRDs out-of-band. With no bundled components
  # selected, the stack addon stands down. If bundled Grafana or Prometheus is
  # selected, the addon still ships kube-prometheus-stack with operator/CRD
  # ownership disabled.
  preInstalled: false
  # Override the addon's pinned kube-prometheus-stack version. Empty = use
  # the addon's default pin.
  chartVersion: ""
  prometheus:
    # Enables the bundled Prometheus server from the current monitoring
    # delivery bundle. When `preInstalled=true`, this creates only the
    # Prometheus CR/services and relies on the user's operator/CRDs.
    enabled: false
    service:
      type: ClusterIP
      nodePort: ""
  grafana:
    # Optional bundled Grafana from kube-prometheus-stack. Can be enabled with
    # either addon-managed or pre-installed operator/CRDs.
    enabled: false
    service:
      type: ClusterIP
      nodePort: ""
    # Publishes Grafana through the shared cc-gateway at the /grafana subpath
    # (an HTTPRoute on the gateway's https listener). Only effective when the
    # gateway addon (gateway.enabled) is on. Independent of service.type: the
    # route is ADDITIVE to however the Service itself is exposed — ClusterIP
    # plus the gateway route is the intended combination.
    gatewayRoute: true
  dashboards:
    # Ships the ClusterControl default Grafana dashboards as ConfigMaps
    # discovered by the Grafana dashboards sidecar. Only effective when
    # grafana.enabled is true — Grafana deployed through the addon comes
    # pre-loaded with the "ClusterControl" folder.
    enabled: true
    # Additionally ships the internal/debug dashboard set ("ClusterControl
    # Internal" folder: reconciler health, scrape coverage). Off by default;
    # intended for support/debug sessions.
    internal: false

# Gateway API publishing edge (CLUS-6203). Installs Envoy Gateway (or
# attaches to a user-provided Gateway API controller) and exposes app-bundle
# services and gateway-mode databases through one shared TLS-terminated
# cc-gateway. Each value renders a GATEWAY_* env var on the agent Pod, read
# by the gateway addon's ConfigFromEnv (internal/addon/gateway/config.go).
gateway:
  # Activates the gateway addon.
  enabled: false
  # Who provides the Gateway API controller: "envoy" (default — the addon
  # installs and owns Envoy Gateway) or "external" (bring your own; requires
  # className).
  implementation: ""
  # GatewayClass name to attach to when implementation=external.
  className: ""
  # Override the addon's pinned envoyproxy/gateway-helm version. Empty = the
  # addon's default pin.
  chartVersion: ""
  # How the Envoy data-plane Service is exposed: "LoadBalancer" (default) or
  # "NodePort". Envoy mode only (shaped via the EnvoyProxy CR).
  serviceType: ""
  # Optional public hostname for the shared cc-gateway; added to the
  # cc-gateway-tls Certificate's dnsNames when set.
  hostname: ""
  # Optionally pin the HTTPS (443) listener's node port when
  # serviceType=NodePort; empty = Kubernetes auto-allocates.
  httpsNodePort: ""
  # Cert story for the shared cc-gateway (CLUS-8482): "selfsigned" (default —
  # self-signed Issuer + cc-gateway-tls Certificate), "acme" (Let's Encrypt
  # production, HTTP-01 through the gateway itself; requires hostname), or
  # "custom-secret" (bring your own TLS Secret; no Issuer/Certificate
  # rendered). Unknown values fail loudly.
  certMode: ""
  # Optional ACME account email (expiry notices). acme mode only.
  acmeEmail: ""
  # TLS Secret (in the gateway namespace) the HTTPS listener terminates with
  # in custom-secret mode. Empty = "cc-gateway-tls".
  certSecretName: ""
  db:
    # Listener-port range for gateway-exposed databases (phase 2). Empty =
    # the addon default 20000-20999. Invalid or inverted values fail the
    # allocation explicitly (GatewayPortAllocationFailed condition) rather
    # than silently exposing on the default range.
    portMin: ""
    portMax: ""

prometheusAgent:
  # Activates the addon. When true, `prometheusStack.enabled` OR
  # `prometheusStack.preInstalled` must also be true — the
  # PrometheusAgent CRD has to come from somewhere. Cross-addon validation
  # in the agent-operator's config-load fails fast on the misconfiguration.
  enabled: false
  # `kubernetes_cluster` external label stamped on every series. UI
  # prefills with the agent name; required when enabled=true.
  clusterLabel: ""
  remoteWrite:
    # `remote_write` target URL. UI prefills with `https://<cc-host>:9090`.
    # Required when enabled=true.
    url: ""
    auth:
      # Only `basic` is wired in v1 (none / bearer / mTLS deferred: basic
      # matches the existing cmon-side Prometheus and keeps the install
      # one-knob; the underlying CR fields stay in scope for later). The
      # PrometheusAgent CR's
      # `remoteWrite.basicAuth` references the Secret named below.
      type: basic
      # Secret with keys `username` + `password`. The chart never creates this
      # Secret and never receives the password. Leave empty to use the addon's
      # default name, `cmon-prom-auth`; the install manifests generated by the
      # UI create that Secret in the `observability` namespace.
      existingSecret: ""
    tls:
      # CC ships self-signed certs by default (CN=127.0.0.1, SAN=localhost) —
      # verifying would fail out of the box. Customers with proper certs
      # flip this off.
      insecureSkipVerify: true

# SOPS GitOps-secrets pipeline (CLUS-7183).
# Pipeline activates when sops.enabled=true AND gitops.enabled=true.
# Spec: Projects/kuber-cc-gitops-secrets/specs/.
sops:
  # Enables the sops-encryption controller and the SOPS addon (which
  # installs sops-secrets-operator + the keygen Job).
  #
  # Single source of truth (CLUS-7411): this one value renders BOTH the
  # SOPS_ENABLED env var and the s9s:sops-pipeline ClusterRole. Unrestricted
  # mode includes cluster-wide Secret + SopsSecret reads. Restricted mode
  # intentionally omits plaintext Secret read and retains only SopsSecret
  # read; until Pattern A has per-granted-namespace informers, its capability
  # probe disables the watchers with one WARN
  # ("SOPS Pattern A disabled: missing RBAC") and
  # kuber_sops_pattern_a_status{status="rbac_denied"}=1 instead of hammering
  # the API server with Forbidden list/watch retries. Pattern B (CCR
  # apply-path encryption) keeps working either way.
  # Requires gitops.enabled=true (enforced in templates/validations.yaml).
  enabled: false
  # When true, the user pre-applies sops-age-key + sops-age-pubkey themselves
  # and the addon ships only the AppBundle (no keygen Job + RBAC).
  byoKeys: false
  # When true, the user runs their own sops-secrets-operator out-of-band; the
  # addon stands down (no AppBundle, no keygen).
  preInstalled: false
  # Keygen Job base image. Must ship kubectl pre-installed AND have apk
  # available; alpine/k8s is the community image that fits both. The Job
  # uses kubectl for the check-before-write gate (no package install needed
  # on idempotent re-runs) and apk to fetch `age` only when keys must be
  # generated. No off-the-shelf image bundles age + kubectl together; the
  # project chose this combination over maintaining a custom keygen image.
  keygenImage: "alpine/k8s:1.31.5"

# AppBundle importer configuration
appBundleImport:
  enabled: true               # Enable background importer to create AppBundle CRs from Argo/Flux
  provider: ""                # argo | flux | "" (both)
  interval: "1m"              # Sweep interval (e.g., 30s, 1m)
  crNamespace: ""             # Namespace to create AppBundle CRs (default: POD_NAMESPACE when empty)
  manageLifecycle: false       # Set spec.manageLifecycle on generated CRs

# Controller authentication (token used by controller for GitOps PRs/commits)
controllerAuth:
  secret:
    enabled: false
    name: ""   # e.g. s9s-gitops-token
    key: "token"
    value: ""
  provider: "github"   # keep option for future providers; current: github
  baseURL: ""          # optional base URL for GitHub Enterprise
