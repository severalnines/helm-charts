{{- if and .Values.grafana.enabled (has "certManager" .Values.externalToolsMonitoring) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ccx-cert-manager-dashboard
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: "Helm"
data:
  cert-manager.json: |
{{ (.Files.Get "dashboards/K8s/cert-manager.json") | indent 4 }}
{{- end }}
