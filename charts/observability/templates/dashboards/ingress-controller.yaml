{{- if and .Values.grafana.enabled (has "ingressController" .Values.externalToolsMonitoring) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ccx-ingress-controller-dashboard
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: "Helm"
data:
  ingress-nginx.json: |
{{ (.Files.Get "dashboards/K8s/ingress-nginx.json") | indent 4 }}
{{- end }}
