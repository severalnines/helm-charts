{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ccx-databases-dashboards
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: "Helm"  
data: 
  mssql.json: |
{{ (.Files.Get "dashboards/DB/mssql.json") | indent 4 }}
  mysql.json: |
{{ (.Files.Get "dashboards/DB/mysql.json") | indent 4 }}
  redis.json: |
{{ (.Files.Get "dashboards/DB/redis.json") | indent 4 }}
  postgres.json: |
{{ (.Files.Get "dashboards/DB/postgres.json") | indent 4 }}
{{- end }}