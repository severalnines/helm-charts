{{- /*
Dashboards for CCX's own control-plane databases. Customer datastore dashboards
(MySQL/MariaDB, PostgreSQL, Redis/Valkey, SQL Server) live in ccx-datastores.yaml.
*/}}
{{- if and .Values.grafana.enabled (or (has "cmonDb" .Values.externalToolsMonitoring) (has "ccxDb" .Values.externalToolsMonitoring)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ccx-databases-dashboards
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: "Helm"
data:
{{- if has "cmonDb" .Values.externalToolsMonitoring }}
  mysql-innodb-ccx.json: |
{{ (.Files.Get "dashboards/DB/mysql-innodb-ccx.json") | indent 4 }}
{{- end }}
{{- if has "ccxDb" .Values.externalToolsMonitoring }}
  postgres12-monitor.json: |
{{ (.Files.Get "dashboards/DB/postgres12-monitor.json") | indent 4 }}
{{- end }}
{{- end }}
