#CCX cluster name - should be unique
cluster_name: &cluster_name "ccx"
ccx_host: &ccx_host "ccx"
cmon_sd_url: &cmon_sd_url "http://cmon-master.ccx:8080"
# by default this sets to release.name-victoria-metrics-single-server
# change if necessary
victoria_metrics_url: &victoria_metrics_url "http://ccx-monitoring-victoria-metrics-single-server:9090"
# by default this sets to release.name-alertmanager
# change if necessary
alertmanager_url: &alertmanager_url "http://ccx-monitoring-alertmanager:9093"
#change the namespace in webhook config url to trigger email notifications.
webhook_config_url: &webhook_config_url "http://ccx-stores-listener-svc:18097/alert-manager"

victoria-metrics-single:
  #set enabled to false to disable this app
  enabled: true
  server:
    service:
      servicePort: 9090
      clusterIP: null
    statefulSet:
      enabled: false
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '8428'
    extraArgs:
      envflag.enable: "true"
      envflag.prefix: VM_
      loggerFormat: json
      promscrape.maxScrapeSize: 56777216
      maxLabelsPerTimeseries: 99
    scrape:
      enabled: true
      configMap: ""
      ### below is standard victoria metrics config, change as needed
      ### provided is simple, default config
      config:
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
          external_labels:
            cluster: *cluster_name
            #use_cmon_sd is required DO NOT REMOVE
            use_cmon_sd: true
            #monitor: clustercontrol is required DO NOT REMOVE
            monitor: clustercontrol
        scrape_configs:
          # -- Scrape rule for scrape victoriametrics
          - job_name: victoriametrics
            static_configs:
              - targets: [ "localhost:8428" ]
            relabel_configs:
              - target_label: cluster
                replacement: *cluster_name

            ## COPY from Prometheus helm chart https://github.com/helm/charts/blob/master/stable/prometheus/values.yaml

            # -- Scrape config for API servers.
            #
            # Kubernetes exposes API servers as endpoints to the default/kubernetes
            # service so this uses `endpoints` role and uses relabelling to only keep
            # the endpoints associated with the default/kubernetes service using the
            # default named port `https`. This works for single API server deployments as
            # well as HA API server deployments.
          - job_name: "kubernetes-apiservers"
            kubernetes_sd_configs:
              - role: endpoints
            # Default to scraping over https. If required, just disable this or change to
            # `http`.
            scheme: https
            # This TLS & bearer token file config is used to connect to the actual scrape
            # endpoints for cluster components. This is separate to discovery auth
            # configuration because discovery & scraping are two separate concerns in
            # Prometheus. The discovery auth config is automatic if Prometheus runs inside
            # the cluster. Otherwise, more config options have to be provided within the
            # <kubernetes_sd_config>.
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              # If your node certificates are self-signed or use a different CA to the
              # master CA, then disable certificate verification below. Note that
              # certificate verification is an integral part of a secure infrastructure
              # so this should only be disabled in a controlled environment. You can
              # disable certificate verification by uncommenting the line below.
              #
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            # Keep only the default/kubernetes service endpoints for the https port. This
            # will add targets for each API server which Kubernetes adds an endpoint to
            # the default/kubernetes service.
            relabel_configs:
              - source_labels:
                  [
                      __meta_kubernetes_namespace,
                      __meta_kubernetes_service_name,
                      __meta_kubernetes_endpoint_port_name,
                  ]
                action: keep
                regex: default;kubernetes;https
              - target_label: cluster
                replacement: *cluster_name
            # -- Scrape rule using kubernetes service discovery for nodes
          - job_name: "kubernetes-nodes"
            # Default to scraping over https. If required, just disable this or change to
            # `http`.
            scheme: https
            # This TLS & bearer token file config is used to connect to the actual scrape
            # endpoints for cluster components. This is separate to discovery auth
            # configuration because discovery & scraping are two separate concerns in
            # Prometheus. The discovery auth config is automatic if Prometheus runs inside
            # the cluster. Otherwise, more config options have to be provided within the
            # <kubernetes_sd_config>.
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              # If your node certificates are self-signed or use a different CA to the
              # master CA, then disable certificate verification below. Note that
              # certificate verification is an integral part of a secure infrastructure
              # so this should only be disabled in a controlled environment. You can
              # disable certificate verification by uncommenting the line below.
              #
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [ __meta_kubernetes_node_name ]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$1/proxy/metrics
              - target_label: cluster
                replacement: *cluster_name
            # -- Scrape rule using kubernetes service discovery for cadvisor
          - job_name: "kubernetes-nodes-cadvisor"
            # Default to scraping over https. If required, just disable this or change to
            # `http`.
            scheme: https
            # This TLS & bearer token file config is used to connect to the actual scrape
            # endpoints for cluster components. This is separate to discovery auth
            # configuration because discovery & scraping are two separate concerns in
            # Prometheus. The discovery auth config is automatic if Prometheus runs inside
            # the cluster. Otherwise, more config options have to be provided within the
            # <kubernetes_sd_config>.
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              # If your node certificates are self-signed or use a different CA to the
              # master CA, then disable certificate verification below. Note that
              # certificate verification is an integral part of a secure infrastructure
              # so this should only be disabled in a controlled environment. You can
              # disable certificate verification by uncommenting the line below.
              #
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            # This configuration will work only on kubelet 1.7.3+
            # As the scrape endpoints for cAdvisor have changed
            # if you are using older version you need to change the replacement to
            # replacement: /api/v1/nodes/$1:4194/proxy/metrics
            # more info here https://github.com/coreos/prometheus-operator/issues/633
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [ __meta_kubernetes_node_name ]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
              - target_label: cluster
                replacement: *cluster_name
            # -- Scrape rule using kubernetes service discovery for node exporter
          - job_name: "kubernetes-node-exporter"
            scheme: http
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - action: replace
                source_labels: [__address__]
                regex: (.+):(.+)
                replacement: ${1}:9100
                target_label: __address__
              # Carries the k8s Node name onto every node_exporter series so Host*
              # alerts share a `node` label with kube-state-metrics node-condition
              # alerts - required for Alertmanager inhibition to match them up.
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - target_label: cluster
                replacement: *cluster_name

          # -- Scrape config for service endpoints.
          #
          # The relabeling allows the actual service scrape endpoint to be configured
          # via the following annotations:
          #
          # * `prometheus.io/scrape`: Only scrape services that have a value of `true`
          # * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
          # to set this to `https` & most likely set the `tls_config` of the scrape config.
          # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
          # * `prometheus.io/port`: If the metrics are exposed on a different port to the
          # service then set this appropriately.
          # -- Scrape rule using kubernetes service discovery for endpoints
          - job_name: "kubernetes-service-endpoints"
            kubernetes_sd_configs:
              - role: endpoints
            relabel_configs:
              - action: drop
                source_labels: [ __meta_kubernetes_pod_container_init ]
                regex: true
              - action: keep_if_equal
                source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number ]
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_scrape ]
                action: keep
                regex: true
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_scheme ]
                action: replace
                target_label: __scheme__
                regex: (https?)
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_path ]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels:
                  [
                      __address__,
                      __meta_kubernetes_service_annotation_prometheus_io_port,
                  ]
                action: replace
                target_label: __address__
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
              - action: labelmap
                regex: __meta_kubernetes_service_label_(.+)
              - source_labels: [ __meta_kubernetes_namespace ]
                action: replace
                target_label: kubernetes_namespace
              - source_labels: [ __meta_kubernetes_service_name ]
                action: replace
                target_label: kubernetes_name
              - source_labels: [ __meta_kubernetes_pod_node_name ]
                action: replace
                target_label: kubernetes_node
              - target_label: cluster
                replacement: *cluster_name
          # -- Scrape config for slow service endpoints; same as above, but with a larger
          # timeout and a larger interval
          #
          # The relabeling allows the actual service scrape endpoint to be configured
          # via the following annotations:
          #
          # * `prometheus.io/scrape-slow`: Only scrape services that have a value of `true`
          # * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
          # to set this to `https` & most likely set the `tls_config` of the scrape config.
          # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
          # * `prometheus.io/port`: If the metrics are exposed on a different port to the
          # service then set this appropriately.
          - job_name: "kubernetes-service-endpoints-slow"
            scrape_interval: 5m
            scrape_timeout: 30s
            kubernetes_sd_configs:
              - role: endpoints
            relabel_configs:
              - action: drop
                source_labels: [ __meta_kubernetes_pod_container_init ]
                regex: true
              - action: keep_if_equal
                source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number ]
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_scrape_slow ]
                action: keep
                regex: true
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_scheme ]
                action: replace
                target_label: __scheme__
                regex: (https?)
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_path ]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels:
                  [
                      __address__,
                      __meta_kubernetes_service_annotation_prometheus_io_port,
                  ]
                action: replace
                target_label: __address__
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
              - action: labelmap
                regex: __meta_kubernetes_service_label_(.+)
              - source_labels: [ __meta_kubernetes_namespace ]
                action: replace
                target_label: kubernetes_namespace
              - source_labels: [ __meta_kubernetes_service_name ]
                action: replace
                target_label: kubernetes_name
              - source_labels: [ __meta_kubernetes_pod_node_name ]
                action: replace
                target_label: kubernetes_node
              - target_label: cluster
                replacement: *cluster_name
          # -- Example scrape config for probing services via the Blackbox Exporter.
          #
          # The relabeling allows the actual service scrape endpoint to be configured
          # via the following annotations:
          #
          # * `prometheus.io/probe`: Only probe services that have a value of `true`
          - job_name: "kubernetes-services"
            metrics_path: /probe
            params:
              module: [ http_2xx ]
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels:
                  [ __meta_kubernetes_service_annotation_prometheus_io_probe ]
                action: keep
                regex: true
              - source_labels: [ __address__ ]
                target_label: __param_target
              - target_label: __address__
                replacement: blackbox
              - source_labels: [ __param_target ]
                target_label: instance
              - action: labelmap
                regex: __meta_kubernetes_service_label_(.+)
              - source_labels: [ __meta_kubernetes_namespace ]
                target_label: kubernetes_namespace
              - source_labels: [ __meta_kubernetes_service_name ]
                target_label: kubernetes_name
              - target_label: cluster
                replacement: *cluster_name
          # -- Example scrape config for pods
          #
          # The relabeling allows the actual pod scrape endpoint to be configured via the
          # following annotations:
          #
          # * `prometheus.io/scrape`: Only scrape pods that have a value of `true`
          # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
          # * `prometheus.io/port`: Scrape the pod on the indicated port instead of the default of `9102`.
          - job_name: "kubernetes-pods"
            scheme: http
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - action: drop
                source_labels: [ __meta_kubernetes_pod_container_init ]
                regex: true
              - action: keep_if_equal
                source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number ]
              - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
                action: keep
                regex: true
              - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_path ]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels:
                  [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
                target_label: __address__
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - source_labels: [ __meta_kubernetes_namespace ]
                action: replace
                target_label: kubernetes_namespace
              - source_labels: [ __meta_kubernetes_pod_name ]
                action: replace
                target_label: kubernetes_pod_name
              - target_label: cluster
                replacement: *cluster_name
            ## End of COPY

      extraScrapeConfigs:
        ### CMON SERVICE DISCOVERY
        - job_name: cmon-sd
          http_sd_configs:
            - url: *cmon_sd_url
          relabel_configs:
            - source_labels: [__address__]
              regex: '(.*):(\d+)'
              target_label: ip
              replacement: '${1}'
            - target_label: environment
              replacement: lab
            - target_label: cluster
              replacement: *cluster_name
            - target_label: use_cmon_sd
              replacement: true

        ### END CMON SERVICE DISCOVERY


victoria-metrics-alert:
  #set enabled to false to disable this app
  enabled: true
  server:
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '8880'

    ingress:
      enabled: false
      annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/auth-type: basic
        nginx.ingress.kubernetes.io/auth-secret: vmalert-basic-auth
        nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
      hosts:
        - name: CHANGE_ME
          path: /
      tls:
        - secretName: vmalert-cert
          hosts:
            - CHANGE_ME
      # ingressClassName: nginx

    extraArgs:
      external.url:
      # grafana_url is referenced as {{ $externalLabels.grafana_url }} in the
      # dashboard_url annotations below - set it once here to your Grafana
      # ingress URL (no trailing slash) and every alert's "Dashboard" Slack
      # button picks it up, without having to edit each annotation.
      external.label: "grafana_url=CHANGE_ME"

    # vmalert reads metrics from source, next section represents its configuration. It can be any service which supports
    # MetricsQL or PromQL.
    datasource:
      url: *victoria_metrics_url

    notifier:
      alertmanager:
        url: *alertmanager_url

    # Required because the anomaly detection rules (AnomalyAdaptive* groups below) contain
    # recording rules - vmalert refuses to start if recording rules exist with no remoteWrite
    # target, since their results have nowhere to be persisted.
    remote:
      write:
        # vmalert appends /api/v1/write itself - do not include the path here.
        url: "http://ccx-monitoring-victoria-metrics-single-server:9090"

    #get at least 2 instances on different nodes
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
                - {key: app.kubernetes.io/name, operator: In, values: [vmalert]}

    # vmalert alert rules configuration configuration:
    # use existing configmap if specified
    # otherwise .config values will be used
    config:
      alerts:
        groups:
        - name: Datastore Status
          rules:
          - alert: Cluster Failed
            # Condition for alerting
            expr: increase(cmon_cluster_failed_total[5m]) > 0
            for: 0m
            # Annotation - additional informational labels to store more information
            annotations:
              summary: "Cluster `{{ $labels.ControllerId }}` has FAILED"
              description: "cmon reported this cluster in a failed state within the last 5 minutes. This typically means the cluster is fully down or unrecoverable without intervention — check cmon's own logs and the cluster's current state for details on what triggered the failure."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#cluster-failed-degraded-or-failed-to-init"
            # Labels - additional labels to be attached to the alert
            labels:
              severity: 'critical'

          - alert: Cluster Degraded
            # Condition for alerting
            expr: increase(cmon_cluster_degraded_total[5m]) > 0
            for: 0m
            # Annotation - additional informational labels to store more information
            annotations:
              summary: "Cluster `{{ $labels.ControllerId }}` is DEGRADED"
              description: "cmon reported this cluster in a degraded state within the last 5 minutes. Degraded typically means the cluster is still operating but with reduced capacity or redundancy (e.g. a node down, replication lag) — worth investigating before it potentially escalates to a full failure."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#cluster-failed-degraded-or-failed-to-init"
            # Labels - additional labels to be attached to the alert
            labels:
              severity: 'warning'

          # TODO - missing metrics for this alert to be functioning
          # - alert: Datastore Repair Failed
          #   # Condition for alerting
          #   expr: increase(datastores_repairs_failed[5m]) > 0
          #   for: 0m
          #   # Annotation - additional informational labels to store more information
          #   annotations:
          #     title: 'Datastore {{ $labels.datastore }} repair has FAILED'
          #     summary: '{{ $labels.datastore }} Datastore repair job has failed.'
          #   # Labels - additional labels to be attached to the alert
          #   labels:
          #     severity: 'critical'

          - alert: Cluster Failed to Initialize
            # Condition for alerting
            expr: increase(cmon_cluster_failed_init_total[5m]) > 0
            for: 0m
            # Annotation - additional informational labels to store more information
            annotations:
              summary: "Cluster `{{ $labels.ControllerId }}` failed to initialize"
              description: "cmon reported this cluster failing during initialization within the last 5 minutes. This usually means cluster creation never completed successfully — check cmon's job log for this cluster to see what step failed."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#cluster-failed-degraded-or-failed-to-init"
            # Labels - additional labels to be attached to the alert
            labels:
              severity: 'critical'

        - name: CCX Alerts
          rules:
          - alert: NewUser
            expr: increase(admin_users_total[1m]) > 0
            for: 0m
            labels:
              severity: info
            annotations:
              summary: "A new user has signed up"
              description: "{{ $value }} new user(s) signed up in the last minute. This is an informational event, not an issue — no action needed unless you're tracking signups for a specific reason."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#new-user-and-datastore-created"
          - alert: DatastoreCreated
            expr: increase(admin_datastores_total{status="all"}[1m]) > 0
            for: 0m
            labels:
              severity: info
            annotations:
              summary: "A new datastore has been created"
              description: "{{ $value }} new datastore(s) created in the last minute. This is an informational event, not an issue — no action needed unless you're tracking datastore creation for a specific reason."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#new-user-and-datastore-created"

        - name: Deployment status
          rules:
          - alert: DeploymentDown
            labels:
              namespace: "{{ $labels.namespace }}"
              name: "{{ $labels.deployment }}"
              severity: critical
            expr: kube_deployment_status_replicas_available < 1
            for: 5m
            annotations:
              summary: "Deployment `{{ $labels.deployment }}` in `{{ $labels.namespace }}` has 0 available replicas"
              description: "This Deployment has had zero available replicas for at least 5 minutes, meaning the service it backs is likely fully unavailable. Check pod status and recent events in the namespace to find out why replicas aren't coming up (crash loop, failed scheduling, resource limits, etc.)."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#service-down"

        - name: Statefulset status
          rules:
          - alert: StatefulSetDown
            labels:
              namespace: "{{ $labels.namespace }}"
              name: "{{ $labels.statefulset }}"
              severity: critical
            expr: kube_statefulset_status_replicas_available < 1
            for: 5m
            annotations:
              summary: "StatefulSet `{{ $labels.statefulset }}` in `{{ $labels.namespace }}` has 0 available replicas"
              description: "This StatefulSet has had zero available replicas for at least 5 minutes, meaning the service it backs is likely fully unavailable. Check pod status and recent events in the namespace to find out why replicas aren't coming up (crash loop, failed scheduling, resource limits, etc.)."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#service-down"

        - name: Metrics alerts
          rules:
          - alert: MetricsJobMissing
            expr: absent(up{job="victoriametrics"})
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "VictoriaMetrics scrape target `{{ $labels.job }}` has disappeared"
              description: "The victoriametrics job is no longer being scraped — this is the metrics backend itself, so if it's down, other alerts and dashboards may also be unreliable or delayed. Check whether the VictoriaMetrics pod is running and whether it's still reachable from the scrape config."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#metrics-stack-self-monitoring"
          - alert: MetricsTargetMissing
            expr: up == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Metrics target `{{ $labels.job }}` on `{{ $labels.instance }}` is down"
              description: "This scrape target has been unreachable for 10 minutes — the exporter process may have crashed, the pod may have restarted, or there could be a network/firewall issue between VictoriaMetrics and this target. Check whether the exporter is running and whether its metrics port is reachable."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#metrics-stack-self-monitoring"
          - alert: MetricsAllTargetsMissing
            expr: sum by (job) (up) == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "All targets for job `{{ $labels.job }}` are down"
              description: "Every single instance of this scrape job has been unreachable for 10 minutes — this is broader than a single exporter failing, it means the whole job category has no surviving targets. This could indicate a widespread outage, a misconfigured scrape job, or a service-wide crash. Check the job's scrape config and whether the underlying service/deployment is healthy."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#metrics-stack-self-monitoring"

        - name: Kubernetes Apps
          rules:
          - alert: KubernetesContainerOomKiller
            expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Container `{{ $labels.container }}` OOMKilled in `{{ $labels.namespace }}/{{ $labels.pod }}`"
              description: "This container has been OOMKilled {{ $value }} time(s) in the last 10 minutes. This usually means it's hitting its memory limit — check whether the limit is too low for its actual usage, or whether there's a memory leak."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#kubernetes-container-oom-killer"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/k8s_views_pods/kubernetes-views-pods?orgId=1&var-datasource=PA58DA793C7250F1B&var-namespace={{ $labels.namespace }}&var-pod={{ $labels.pod }}&var-resolution=30s"
          - alert: KubernetesPodCrashLooping
            expr: (sum(increase(kube_pod_container_status_restarts_total[10m])) by (container, instance, pod, namespace)) > 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Container `{{ $labels.container }}` in `{{ $labels.namespace }}/{{ $labels.pod }}` is crash looping"
              description: "This container has restarted more than once in the last 10 minutes. Common causes: application errors on startup, failing health/liveness checks, missing config or secrets, or a bad image/deploy. Check the container's logs and recent events for the actual failure reason."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#kubernetes-pod-crash-looping"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/k8s_views_pods/kubernetes-views-pods?orgId=1&var-datasource=PA58DA793C7250F1B&var-namespace={{ $labels.namespace }}&var-pod={{ $labels.pod }}&var-resolution=30s"
          - alert: PVCVolumeUsage
            expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.80
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PVC `{{ $labels.persistentvolumeclaim }}` on `{{ $labels.namespace }}` is almost full"
              description: "This PVC is using more than 80% of its capacity ({{ $value | humanizePercentage }}). If usage keeps growing, the pod using this volume may fail to write once it's completely full — consider resizing the PVC or investigating what's consuming the space."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#pvc-volume-usage"
          - alert: KubernetesPodNotHealthy
            expr: kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod `{{ $labels.namespace }}/{{ $labels.pod }}` is stuck in `{{ $labels.phase }}`"
              description: "This pod has been in a non-running phase for more than 15 minutes. This is distinct from crash-looping — it means the pod isn't reaching a running state at all, often due to a scheduling failure, image pull error, or resource constraint. Check `kubectl describe pod` for the pod's events."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#kubernetes-pod-not-healthy"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/k8s_views_pods/kubernetes-views-pods?orgId=1&var-datasource=PA58DA793C7250F1B&var-namespace={{ $labels.namespace }}&var-pod={{ $labels.pod }}&var-resolution=30s"
          - alert: UnreadyEndpoints
            expr: kube_endpoint_address_not_ready > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Service `{{ $labels.namespace }}/{{ $labels.endpoint }}` has unready endpoints"
              description: "This service has one or more endpoints that aren't ready to receive traffic. This usually means the backing pods are failing readiness checks — check pod status in this namespace."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#unready-endpoints"
        - name: Node Conditions
          rules:
          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="false"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node `{{ $labels.node }}` is NotReady"
              description: "This node has been NotReady for more than 5 minutes. This usually means kubelet has stopped reporting in, or the node has a network/resource issue preventing it from being scheduled to. Check the node's kubelet status and system resources."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#kubernetes-node-not-ready"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/k8s_views_nodes/kubernetes-views-nodes?orgId=1&var-job=node-exporter&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-resolution=30s&var-node={{ $labels.node }}&var-instance={{ $labels.node }}"
          - alert: DiskPressure
            expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Node `{{ $labels.node }}` is under disk pressure"
              description: "This node has been under disk pressure for more than 2 minutes, meaning it's running low on available disk space or inodes. Kubernetes may start evicting pods from this node to free up space. Check disk usage on the node and clean up if needed."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#kubernetes-disk-and-memory-pressure"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/k8s_views_nodes/kubernetes-views-nodes?orgId=1&var-job=node-exporter&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-resolution=30s&var-node={{ $labels.node }}&var-instance={{ $labels.node }}"
          - alert: MemoryPressure
            expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Node `{{ $labels.node }}` is under memory pressure"
              description: "This node has been under memory pressure for more than 2 minutes, meaning available memory is running low. Kubernetes may start evicting pods from this node to free up memory. Check what's consuming memory on the node and whether workloads need better limits or the node needs more capacity."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#kubernetes-disk-and-memory-pressure"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/k8s_views_nodes/kubernetes-views-nodes?orgId=1&var-job=node-exporter&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-resolution=30s&var-node={{ $labels.node }}&var-instance={{ $labels.node }}"

        - name: Hosts alerts
          rules:
          - alert: HostOutOfMemory
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` is low on memory"
              description: "Available memory on this host has dropped below 10%. Check what's consuming memory — a runaway process, memory leak, or workloads that need better resource limits."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-out-of-memory"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"         
          - alert: HostMemoryUnderPressure
            expr: rate(node_vmstat_pgmajfault[1m]) > 1000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` is under memory pressure"
              description: "This host has a high rate of major page faults, meaning it's frequently swapping data from disk due to insufficient available memory. This degrades performance and often precedes an out-of-memory condition — check memory usage and consider adding capacity or reducing workload."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-memory-under-pressure"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostUnusualDiskReadRate
            expr: sum by (instance, node) (rate(node_disk_read_bytes_total[2m])) / 1024 / 1024 > 50
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` has an unusual disk read rate"
              description: "This host is reading more than 50 MB/s from disk, sustained over 10 minutes. This could be a legitimate heavy workload (backup, large query, batch job) or a symptom of something misbehaving — check what process is driving the I/O and whether it's expected."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-unusual-disk-io-rate"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostUnusualDiskWriteRate
            expr: sum by (instance, node) (rate(node_disk_written_bytes_total[2m])) / 1024 / 1024 > 50
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` has an unusual disk write rate"
              description: "This host is writing more than 50 MB/s to disk, sustained over 10 minutes. This could be a legitimate heavy workload (backup, large write batch, log rotation) or a symptom of something misbehaving — check what process is driving the I/O and whether it's expected."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-unusual-disk-io-rate"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostAutoScaleDiskSpaceReached
            expr: (1 - (node_filesystem_avail_bytes{mountpoint ="/data"} / node_filesystem_size_bytes{mountpoint ="/data"})) * 100 > 70
            for: 2m
            labels:
              severity: warning
              alert_category: webhook-alerts
            annotations:
                summary: "Host `{{ $labels.instance }}` has reached its disk autoscale threshold ({{ $value | humanize }}%)"
                description: "Disk usage on `/data` has exceeded 70%, which is the threshold configured to trigger autoscaling. If autoscaling is working correctly, more disk space should be provisioned automatically — if usage keeps climbing past this point, check whether the autoscale mechanism itself is functioning."
                runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#disk-autoscaling-issues"
                dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          # Please add ignored mountpoints in node_exporter parameters like
          # "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|run)($|/)".
          # Same rule using "node_filesystem_free_bytes" will fire when disk fills for non-root users.
          - alert: HostOutOfDiskSpace
            expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10 and ON (instance, device, mountpoint) node_filesystem_readonly == 0
            for: 5m
            labels:
              severity: critical
              alert_category: webhook-alerts
            annotations:
              summary: "Host `{{ $labels.instance }}` is almost out of disk space on `{{ $labels.mountpoint }}`"
              description: "Available space on this filesystem has dropped below 10%. If it fills completely, writes may start failing and services relying on this disk could break. Check what's consuming space and whether it can be cleaned up or expanded."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-out-of-disk-space"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          # Please add ignored mountpoints in node_exporter parameters like
          # "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|run)($|/)".
          # Same rule using "node_filesystem_free_bytes" will fire when disk fills for non-root users.
          - alert: HostDiskWillFillIn24Hours
            expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10 and ON (instance, device, mountpoint) predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs"}[1h], 24 * 3600) < 0 and ON (instance, device, mountpoint) node_filesystem_readonly == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` is predicted to run out of space on `{{ $labels.mountpoint }}` within 24 hours"
              description: "Based on the current write rate over the last hour, this filesystem is projected to fill up within 24 hours. This gives you a window to act before it becomes critical — check what's growing and whether it can be cleaned up, rotated, or the volume expanded proactively."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-disk-will-fill-in-24-hours"
              dashboard: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostOutOfInodes
            expr: node_filesystem_files_free{mountpoint ="/rootfs"} / node_filesystem_files{mountpoint="/rootfs"} * 100 < 10 and ON (instance, device, mountpoint) node_filesystem_readonly{mountpoint="/rootfs"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` is almost out of inodes on `{{ $labels.mountpoint }}`"
              description: "Fewer than 10% of available inodes remain on this filesystem. Inodes are a separate limit from disk space — you can run out of inodes even with plenty of free space left, usually caused by a very large number of small files. If this fills up, new files can't be created even though there's disk space available. Check for directories with excessive file counts (e.g. logs, temp files, or a leaking process)."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-out-of-inodes"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostHighCpuLoad
            expr: 100 - (avg by(instance, node) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` has high CPU load"
              description: "CPU usage on this host has exceeded 80%. Check what process is driving the load — this could be a legitimate spike in traffic/work, an inefficient query, or a runaway process."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-high-cpu-load"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostCpuStealNoisyNeighbor
            expr: avg by(instance, node) (rate(node_cpu_seconds_total{mode="steal"}[5m])) * 100 > 10
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` is experiencing CPU steal"
              description: "CPU steal time has exceeded 10% on this host. This means the hypervisor is taking CPU cycles away from this VM — usually caused by a noisy neighbor on the same physical host, or a spot/burstable instance running out of allotted credit. This isn't something you can fix on the VM itself; check with the cloud provider or consider moving to a different instance."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-cpu-steal-noisy-neighbor"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostCpuHighIowait
            expr: avg by (instance, node) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100 > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` has high CPU iowait"
              description: "CPU iowait has exceeded 5% on this host, meaning the CPU is spending significant time waiting on disk or network I/O rather than doing work. Check disk read/write rates and network activity on this host to identify what's causing the bottleneck."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-cpu-high-iowait"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          # 1000 context switches is an arbitrary number.
          # Alert threshold depends on nature of application.
          # Please read: https://github.com/samber/awesome-prometheus-alerts/issues/58
          - alert: HostContextSwitching
            expr: (rate(node_context_switches_total[5m])) / (count without(cpu, mode) (node_cpu_seconds_total{mode="idle"})) > 1000
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Host `{{ $labels.instance }}` has a high context switch rate"
              description: "This host is averaging more than 1000 context switches per second per CPU. High context switching often indicates CPU oversubscription, too many competing processes/threads, or inefficient application behavior — check running processes and whether this host is over-provisioned for its workload."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-context-switching"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
          - alert: HostOomKillDetected
            expr: increase(node_vmstat_oom_kill[1m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Host `{{ $labels.instance }}` had a process OOM killed"
              description: "The kernel forcibly terminated a process on this host to free memory. This means the host ran critically low on available memory — check system logs (`dmesg` or `journalctl -k`) to identify which process was killed and investigate whether it's a memory leak, undersized limits, or genuine memory pressure on the host."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#host-oom-kill-detected"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/rYdddlPWk/node-exporter-full?orgId=1&var-datasource=c56ad79b-b6df-425f-9ad8-5b0497d40d79&var-job=node-exporter&var-node={{ $labels.node }}"
        - name: MySQL Alerts
          rules:
          - alert: MysqlTooManyConnections
            expr: max_over_time(mysql_global_status_threads_connected[1m]) / mysql_global_variables_max_connections * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "MySQL on `{{ $labels.instance }}` has too many connections"
              description: "More than 80% of the configured max_connections limit is currently in use. If this keeps climbing, new connections will start being rejected. Check for connection leaks in the application, unclosed connections, or whether max_connections needs to be raised for current load."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#mysql-too-many-connections"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/549c2bf8936f7767ea6ac47c47b00f2a/mysql-dashboard?orgId=1&var-datasource=PA58DA793C7250F1B&var-job=cmon-sd-elastx&var-instance={{ $labels.instance }}"
          - alert: MysqlSlaveReplicationLag
            expr: mysql_slave_status_master_server_id > 0 and ON (instance) (mysql_slave_status_seconds_behind_master - mysql_slave_status_sql_delay) > 30
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "MySQL replica on `{{ $labels.instance }}` is lagging behind its source"
              description: "This replica is more than 30 seconds behind its source database. If this keeps growing, reads from this replica may return stale data, and failover to this replica would lose recent writes. Check replication status and whether the replica is under heavy load or has a slow query bottleneck."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#mysql-slave-replication-lag"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/549c2bf8936f7767ea6ac47c47b00f2a/mysql-dashboard?orgId=1&var-datasource=PA58DA793C7250F1B&var-job=cmon-sd-elastx&var-instance={{ $labels.instance }}"
          - alert: MysqlDown
            expr: mysql_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "MySQL on `{{ $labels.instance }}` is down"
              description: "The mysqld_exporter can reach the host but MySQL itself is not responding. This is more severe than an exporter/scrape failure — the database process itself appears to be down."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#mysql-down"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/549c2bf8936f7767ea6ac47c47b00f2a/mysql-dashboard?orgId=1&var-datasource=PA58DA793C7250F1B&var-job=cmon-sd-elastx&var-instance={{ $labels.instance }}"
          - alert: MysqlSlaveReplicationStopped
            expr: mysql_slave_status_slave_sql_running == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "MySQL replication is stopped on `{{ $labels.instance }}`"
              description: "The SQL replication thread is not running on this replica. Unlike replication lag, this means replication has fully halted — no new data is being applied at all. Check the replica's error log for the specific replication error."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#mysql-slave-replication-stopped"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/549c2bf8936f7767ea6ac47c47b00f2a/mysql-dashboard?orgId=1&var-datasource=PA58DA793C7250F1B&var-job=cmon-sd-elastx&var-instance={{ $labels.instance }}"
        - name: PostgreSQL Alerts
          rules:
          - alert: PostgresqlExporterError
            expr: pg_exporter_last_scrape_error > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Postgres exporter on `{{ $labels.instance }}` failed its last scrape"
              description: "The postgres_exporter's last scrape attempt failed, meaning metrics for this instance may be stale or missing. Check the exporter's logs to see which query failed — often caused by a permissions issue, a schema change, or the database being temporarily unreachable."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#postgresql-exporter-error"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/000000039/postgresql-database?var-interval=5m&orgId=1&var-datasource=PA58DA793C7250F1B&var-instance={{ $labels.instance }}&var-datname=$__all&var-mode=$__all&var-job=$__all"
          - alert: PostgresqlTooManyConnections
            expr: sum by (datname, instance) (pg_stat_activity_count{datname!~"template.*|postgres"}) > pg_settings_max_connections * 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Postgres on `{{ $labels.instance }}` has too many connections to `{{ $labels.datname }}`"
              description: "More than 80% of the configured max_connections limit is currently in use on this database. If this keeps climbing, new connections will start being rejected. Check for connection leaks in the application, unclosed connections, or whether max_connections needs to be raised for current load."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#postgresql-too-many-connections"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/000000039/postgresql-database?var-interval=5m&orgId=1&var-datasource=PA58DA793C7250F1B&var-instance={{ $labels.instance }}&var-datname={{ $labels.datname }}&var-mode=$__all&var-job=$__all"
          - alert: PostgresqlDeadLocks
            expr: increase(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[1m]) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Postgres database `{{ $labels.datname }}` on `{{ $labels.instance }}` is hitting deadlocks"
              description: "{{ $value | humanize }} deadlocks detected in the last minute on this database. Deadlocks usually indicate two or more transactions are competing for the same rows in conflicting order — check application query patterns and transaction ordering, especially recent code changes or increased concurrent load."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#postgresql-dead-locks"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/000000039/postgresql-database?var-interval=5m&orgId=1&var-datasource=PA58DA793C7250F1B&var-instance={{ $labels.instance }}&var-datname={{ $labels.datname }}&var-mode=$__all&var-job=$__all"
          - alert: PostgresqlHighRollbackRate
            expr: rate(pg_stat_database_xact_rollback{datname!~"template.*"}[3m]) / rate(pg_stat_database_xact_commit{datname!~"template.*"}[3m]) > 0.02
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Postgres database `{{ $labels.datname }}` on `{{ $labels.instance }}` has a high rollback rate"
              description: "More than 2% of transactions on this database are being rolled back rather than committed. This often points to application-level errors, failed constraint checks, or deadlocks/lock timeouts causing transactions to abort. Check application logs and recent query errors for the actual cause."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#postgresql-high-rollback-rate"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/000000039/postgresql-database?var-interval=5m&orgId=1&var-datasource=PA58DA793C7250F1B&var-instance={{ $labels.instance }}&var-datname={{ $labels.datname }}&var-mode=$__all&var-job=$__all"
          - alert: PostgresqlDown
            expr: pg_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Postgres on `{{ $labels.instance }}` is down"
              description: "The postgres_exporter can reach the host but Postgres itself is not responding. This is more severe than an exporter/scrape failure — the database process itself appears to be down."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#postgresql-down"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/000000039/postgresql-database?var-interval=5m&orgId=1&var-datasource=PA58DA793C7250F1B&var-instance={{ $labels.instance }}&var-datname=$__all&var-mode=$__all&var-job=$__all"
          - alert: PostgresqlRestarted
            expr: time() - pg_postmaster_start_time_seconds < 60
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Postgres on `{{ $labels.instance }}` restarted recently"
              description: "This Postgres instance's postmaster process started less than a minute ago. An unexpected restart can indicate a crash, OOM kill, or manual intervention — check the Postgres logs around the restart time to confirm the cause."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#postgresql-restarted"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/000000039/postgresql-database?var-interval=5m&orgId=1&var-datasource=PA58DA793C7250F1B&var-instance={{ $labels.instance }}&var-datname=$__all&var-mode=$__all&var-job=$__all"
        - name: Redis Alerts
          rules:
          - alert: RedisDown
            expr: redis_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Redis/Valkey on `{{ $labels.instance }}` is down"
              description: "The redis_exporter can reach the host but Redis/Valkey itself is not responding. This is more severe than an exporter/scrape failure — the database process itself appears to be down."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#redis-down"
        - name: Blackbox Alerts
          rules:
          - alert: EndpointDown
            expr: probe_success{job="blackbox-exporter"} == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Endpoint `{{ $labels.url }}` is down"
              description: "The blackbox exporter's probe against this URL has been failing for 10 minutes. Check whether the service behind it is reachable and whether this is a real outage or a transient network/DNS blip."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#endpoint-down"
          - alert: SSLCertExpiringSoon
            expr: probe_ssl_earliest_cert_expiry{job="blackbox-exporter"} - time() < 86400 * 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "TLS certificate for `{{ $labels.url }}` expires in less than 10 days"
              description: "The earliest-expiring certificate in this endpoint's chain expires in under 10 days. Renew it before it lapses — an expired cert will break TLS for all clients hitting this endpoint."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#ssl-cert-expiring-soon"
        - name: Datastore DNS Alerts
          rules:
          - alert: DatastoreDnsUnreachable
            expr: probe_success{job=~"datastore-dns-check-.*"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Datastore `{{ $labels.DatastoreName }}` ({{ $labels.environment }}) is unreachable via DNS"
              description: "This datastore's main DNS record (cluster `{{ $labels.ClusterName }}`, ClusterID `{{ $labels.ClusterID }}`) is not resolving/reachable on `{{ $labels.environment }}`. This usually means either the DNS record itself is broken or the underlying host is down — check `HostDown`/networking on the cluster's nodes first."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#datastore-dns-unreachable"
        - name: CoreDump Alerts
          rules:
          - alert: NewCoredumpDetected
            expr: increase(cmon_coredump_detected_total[1m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "A new coredump was detected"
              description: "{{ $value }} new coredump(s) detected on the cmon-master pod. This indicates a process crashed unexpectedly — check the coredump for the cause, typically an unhandled exception or memory corruption."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#new-coredump-detected"
        - name: Backup Alerts
          rules:
          - alert: BackupFailed
            expr: increase(cmon_alarms_backup_failed_total[10m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "A datastore backup has failed"
              description: "cmon reported at least one new backup failure alarm in the last 10 minutes. Note: this metric is controller-wide and doesn't identify which specific datastore failed — check the cmon controller UI or logs to find the affected datastore and the actual failure reason."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#troubleshooting-datastore-backups-failing"
          - alert: CCXInternalBackupJobFailed
            expr: kube_job_status_failed{namespace="ccx", job_name=~"logical-backup-acid-ccx-.*|ccxdeps-ccx-s3-backup-schedule.*"} > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CCX internal backup job `{{ $labels.job_name }}` failed"
              description: "This Kubernetes Job backs up CCX's own control-plane database (not a customer datastore) and has failed. Check the job's logs (`kubectl logs job/{{ $labels.job_name }} -n {{ $labels.namespace }}`) to see why it failed."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#mysql-and-postgres-operator-backup-and-restore-validation"

        # Anomaly detection, "adaptive" strategy, from https://github.com/grafana/promql-anomaly-detection
        # Any metric tagged with anomaly_name/anomaly_type (see "Anomaly Tagging" group below) gets
        # mean/stddev-based upper/lower bands computed here, with a 26h smoothing window.
        - name: AnomalyAdaptiveShortTerm
          rules:
          - record: anomaly:adaptive:threshold_by_covar
            expr: |-
              0.5
          - record: anomaly:adaptive:sparse_threshold
            expr: |-
              5/60
          - record: anomaly:adaptive:stddev_multiplier
            #At 2 stddev, ~4.5% of evaluations fall outside the band by
            # chance alone even for a well-behaved metric, and with every tagged
            # node/pod CPU+memory series evaluated continuously, that compounds into
            # frequent Slack noise. 3 stddev (the standard "3-sigma rule") cuts the
            # chance-driven exceedance rate to ~0.27% (~17x fewer) while still
            # reliably catching genuinely large deviations.
            expr: |-
              3
          - record: anomaly:adaptive:margin_multiplier
            expr: |-
              0.5
          - record: anomaly:adaptive:select
            expr: |-
              (
                {anomaly_name!="", anomaly_type="requests", anomaly_select="", anomaly_strategy=~"^$|adaptive"} > 0
                unless avg_over_time({anomaly_name!="", anomaly_type="requests", anomaly_select="", anomaly_strategy=~"^$|adaptive"}[1h]) < on() group_left anomaly:adaptive:sparse_threshold
              )
              OR
              {anomaly_name!="", anomaly_type="latency", anomaly_select="", anomaly_strategy=~"^$|adaptive"} > 0
              OR
              {anomaly_name!="", anomaly_type="errors", anomaly_select="", anomaly_strategy=~"^$|adaptive"} > 0
              OR
              {anomaly_name!="", anomaly_type="resource", anomaly_select="", anomaly_strategy=~"^$|adaptive"} > 0
              OR
              {anomaly_name!="", anomaly_select="", anomaly_strategy=~"^$|adaptive"} > 0
            labels:
              anomaly_select: "1"
              anomaly_strategy: adaptive
          - record: anomaly:adaptive:avg_1h
            expr: |-
              avg_over_time(anomaly:adaptive:select[1h])
          - record: anomaly:adaptive:stddev_1h:filtered
            expr: |-
              stddev_over_time(anomaly:adaptive:select[1h]) > anomaly:adaptive:avg_1h * on() group_left anomaly:adaptive:threshold_by_covar
          - record: anomaly:adaptive:stddev_st
            expr: |-
              avg_over_time(anomaly:adaptive:stddev_1h:filtered[26h])
          - record: anomaly:level
            expr: |-
              anomaly:adaptive:select
          - record: anomaly:lower_band
            expr: |-
              clamp_min(
                min without(prediction_type)
                (
                    label_replace(
                        last_over_time(anomaly:adaptive:avg_1h[2m]) - last_over_time(anomaly:adaptive:stddev_st[2m]) * on() group_left anomaly:adaptive:stddev_multiplier,
                        "prediction_type", "short_term", "", ""
                    )
                    or
                    label_replace(
                        last_over_time(anomaly:adaptive:avg_1h[2m]) - last_over_time(anomaly:adaptive:avg_1h[2m]) * on() group_left anomaly:adaptive:margin_multiplier,
                        "prediction_type", "margin", "", ""
                    )
                    or
                    label_replace(
                        last_over_time(anomaly:adaptive:lower_band_lt[10m]),
                        "prediction_type", "long_term", "", ""
                    )
                ),
                0
              )
          - record: anomaly:upper_band
            expr: |-
              max without(prediction_type)
              (
                label_replace(
                    last_over_time(anomaly:adaptive:avg_1h[2m]) + last_over_time(anomaly:adaptive:stddev_st[2m]) * on() group_left anomaly:adaptive:stddev_multiplier,
                    "prediction_type", "short_term", "", ""
                )
                or
                label_replace(
                    last_over_time(anomaly:adaptive:avg_1h[2m]) + last_over_time(anomaly:adaptive:avg_1h[2m]) * on() group_left anomaly:adaptive:margin_multiplier,
                    "prediction_type", "margin", "", ""
                )
                or
                label_replace(
                    last_over_time(anomaly:adaptive:upper_band_lt[10m]),
                    "prediction_type", "long_term", "", ""
                )
              )

        - name: AnomalyAdaptiveLongTerm
          interval: 15m
          rules:
          - record: anomaly:adaptive:upper_band_lt
            expr: |-
              max without(look_back)
              (
                label_replace(
                    avg_over_time(anomaly:adaptive:select[1h] offset 167h30m)
                    +
                    stddev_over_time(anomaly:adaptive:select[1h] offset 167h30m)
                            * on() group_left anomaly:adaptive:stddev_multiplier,
                "look_back", "1w", "", ""
                )
                or
                label_replace(
                    avg_over_time(anomaly:adaptive:select[1h] offset 23h30m)
                    +
                    stddev_over_time(anomaly:adaptive:select[1h] offset 23h30m)
                            * on() group_left anomaly:adaptive:stddev_multiplier,
                "look_back", "1d", "", ""
                )
              )
          - record: anomaly:adaptive:lower_band_lt
            expr: |-
              min without(look_back)
              (
                label_replace(
                            avg_over_time(anomaly:adaptive:select[1h] offset 167h30m)
                            -
                            stddev_over_time(anomaly:adaptive:select[1h] offset 167h30m)
                            * on() group_left anomaly:adaptive:stddev_multiplier,
                "look_back", "1w", "", ""
                )
                or
                label_replace(
                            avg_over_time(anomaly:adaptive:select[1h] offset 23h30m)
                            -
                            stddev_over_time(anomaly:adaptive:select[1h] offset 23h30m)
                            * on() group_left anomaly:adaptive:stddev_multiplier,
                "look_back", "1d", "", ""
                )
              )

        - name: AnomalyAdaptiveAlerts
          rules:
          - alert: AnomalyDetected
            for: 15m
            expr: >
              last_over_time(anomaly:level[2m]) < last_over_time(anomaly:lower_band{anomaly_strategy="adaptive"}[2m])
              or
              last_over_time(anomaly:level[2m]) > last_over_time(anomaly:upper_band{anomaly_strategy="adaptive"}[2m])
            labels:
              severity: warning
              anomaly_strategy: adaptive
            annotations:
              summary: "Anomaly detected on `{{ $labels.anomaly_name }}` for pod `{{ $labels.namespace }}/{{ $labels.pod }}`"
              description: "This metric has moved outside its expected range based on recent historical baselines, using an adaptive detection strategy. This doesn't necessarily mean something is broken — it means current behavior differs meaningfully from the recent pattern. Check the anomaly dashboard to see the actual vs. expected range and judge whether this reflects a real issue or an expected change in load."
              runbook_url: "https://severalnines.github.io/ccx-docs/docs/admin/Troubleshooting/#anomaly-detected"
              dashboard_url: "{{ $externalLabels.grafana_url }}/d/anomalies-adaptive/anomalies?orgId=1&var-ds=PA58DA793C7250F1B&var-anomaly_name={{ $labels.anomaly_name }}&var-namespace={{ $labels.namespace }}&var-pod={{ $labels.pod }}&var-alertstate=$__all"

        # Tags existing metrics with anomaly_name/anomaly_type so the groups above pick them up.
        # job label matches this repo's node-exporter scrape config (values.yaml "kubernetes-node-exporter"),
        # not upstream's example "node_exporter" job name.
        - name: AnomalyTaggingNodeExporter
          rules:
          - record: anomaly:resource:cpu
            expr: |-
              (((count by (instance, job) (count(node_cpu_seconds_total{job=~"kubernetes-node-exporter"}) by (cpu, instance, job)))
              -
              avg by (instance, job) (sum by (instance, mode, job)(irate(node_cpu_seconds_total{mode='idle',job=~"kubernetes-node-exporter"}[15m])))) * 100)
              /
              count by(instance, job) (count(node_cpu_seconds_total{job=~"kubernetes-node-exporter"}) by (cpu, instance, job))
            labels:
              anomaly_name: "node_cpu"
              anomaly_type: "resource"
              anomaly_strategy: "adaptive"
          - record: anomaly:resource:memory
            expr: |-
              100 -
              (
                avg by (instance, job) (node_memory_MemAvailable_bytes{job=~"kubernetes-node-exporter"}) /
                avg by (instance, job) (node_memory_MemTotal_bytes{job=~"kubernetes-node-exporter"})
              * 100
              )
            labels:
              anomaly_name: "node_memory"
              anomaly_type: "resource"
              anomaly_strategy: "adaptive"

        # Per-pod anomaly detection, cluster-wide (all namespaces).
        # container="" is deliberately excluded: cAdvisor's own pod-level cgroup
        # rollup is ambiguous/duplicated (two different values seen for the same
        # pod in testing)
        # job/instance are kept (job is always "kubernetes-nodes-cadvisor" here,
        # instance is the node the pod happens to be scheduled on) purely so the
        # existing Anomalies dashboard's job/instance selectors don't filter these
        # series out - they're not meaningful identity for a pod the way they are
        # for a node.
        - name: AnomalyTaggingPods
          rules:
          - record: anomaly:resource:pod_cpu
            expr: |-
              sum by (namespace, pod, job, instance) (
                irate(container_cpu_usage_seconds_total{container!="", container!="POD"}[15m])
              )
            labels:
              anomaly_name: "pod_cpu"
              anomaly_type: "resource"
              anomaly_strategy: "adaptive"
          - record: anomaly:resource:pod_memory
            expr: |-
              sum by (namespace, pod, job, instance) (
                container_memory_working_set_bytes{container!="", container!="POD"}
              ) / 1048576
            labels:
              anomaly_name: "pod_memory"
              anomaly_type: "resource"
              anomaly_strategy: "adaptive"


alertmanager:
  #set enabled to false to disable this app
  enabled: true
  replicaCount: 2

  podAntiAffinity: "hard"
  podAntiAffinityTopologyKey: kubernetes.io/hostname

  podAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9093'

  ingress:
    enabled: false
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: alertmanager-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    hosts:
      - host: CHANGE_ME
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: alertmanager-cert
        hosts:
          - CHANGE_ME

  extraArgs:
    web.external-url:

  config:
    global:
      resolve_timeout: 15m

    route:
      receiver: 'slack-notifications'
      routes:
        - receiver: webhook-alerts
          group_by: [ClusterName, instance, alertname]
          group_interval: 1m
          repeat_interval: 10m
          group_wait: 30s
          continue: true
          matchers:
            - alert_category="webhook-alerts"
        - receiver: slack-notifications
          group_by: [alertname, instance]
          group_wait: 10s
          group_interval: 5m
      repeat_interval: 24h

    inhibit_rules:
      - source_matchers:
          - alertname=~"KubeNodeNotReady|DiskPressure|MemoryPressure"
        target_matchers:
          - alertname=~"Host.*"
        equal: ['cluster', 'node']

    receivers:
    - name: webhook-alerts
      webhook_configs:
      - url: *webhook_config_url
        send_resolved: false

    - name: slack-notifications
      slack_configs:
      - channel: "#CHANGE-ME"
        api_url: http://CHANGE_ME.COM
        send_resolved: true
        icon_url: https://avatars3.githubusercontent.com/u/3380462
        color: '{{ template "slack.color" . }}'
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        actions:
          - type: button
            text: 'Runbook :green_book:'
            url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
          - type: button
            text: 'Query :mag:'
            url: '{{ (index .Alerts 0).GeneratorURL }}'
          - type: button
            text: 'Dashboard :chart_with_upwards_trend:'
            url: '{{ (index .Alerts 0).Annotations.dashboard_url }}'
          - type: button
            text: 'Silence :no_bell:'
            url: '{{ template "__alert_silence_link" . }}'

    templates:
      - '/etc/alertmanager/*.tmpl'

  templates:
    alertmanager.tmpl: |-
      {{ define "__alert_silence_link" -}}
          {{ .ExternalURL }}/#/silences/new?filter=%7B
          {{- range .CommonLabels.SortedPairs -}}
              {{- if ne .Name "alertname" -}}
                  {{- .Name }}%3D"{{- .Value -}}"%2C%20
              {{- end -}}
          {{- end -}}
          alertname%3D"{{- .CommonLabels.alertname -}}"%7D
      {{- end }}

      {{ define "__alert_severity" -}}
        {{- if eq .CommonLabels.severity "critical" -}}
        *Severity: CRITICAL* 🚨
        {{- else if eq .CommonLabels.severity "warning" -}}
        *Severity: WARNING* ⚠️
        {{- else if eq .CommonLabels.severity "info" -}}
        *Severity: Info* ℹ️
        {{- else -}}
        :question: *Severity:* {{ .CommonLabels.severity }}
        {{- end }}
      {{- end }}

      {{ define "slack.title" -}}
          [{{ .Status | toUpper -}}
          {{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{- end -}}
          ] {{ .CommonLabels.alertname }}
      {{- end }}

      {{ define "slack.color" -}}
          {{ if eq .Status "firing" -}}
              {{ if eq .CommonLabels.severity "warning" -}}
              warning
              {{- else if eq .CommonLabels.severity "critical" -}}
              danger
              {{- else -}}
              #439FE0
              {{- end -}}
          {{- else -}}
          good
          {{- end }}
      {{- end }}

      {{ define "slack.text" -}}
        {{ template "__alert_severity" . }}
        {{- if (index .Alerts 0).Annotations.summary }}
        {{- "\n" -}}
        *Summary:* {{ (index .Alerts 0).Annotations.summary }}
        {{- end }}
        {{- range .Alerts }}
            {{- if .Annotations.description }}
            {{- "\n" -}}
            *Description:* {{ .Annotations.description }}
            {{- "\n" -}}
            {{- end }}
            {{- if .Annotations.message }}
            {{- "\n" -}}
            {{ .Annotations.message }}
            {{- "\n" -}}
            {{- end }}
            {{- if .Labels.kubernetes_namespace -}}
            {{ "\n" }}*Namespace:* `{{ .Labels.kubernetes_namespace }}`
            {{- end -}}
            {{- if .Labels.kubernetes_pod_name -}}
            {{ "\n" }}*Pod:* `{{ .Labels.kubernetes_pod_name }}`
            {{- end -}}
            {{- if and (not .Labels.kubernetes_namespace) .Labels.namespace -}}
            {{ "\n" }}*Namespace:* `{{ .Labels.namespace }}`
            {{- end -}}
            {{- if and (not .Labels.kubernetes_pod_name) .Labels.pod -}}
            {{ "\n" }}*Pod:* `{{ .Labels.pod }}`
            {{- end -}}
            {{- if .Labels.node -}}
            {{ "\n" }}*Node:* `{{ .Labels.node }}`
            {{- end -}}
        {{- end }}
      {{- end }}


kube-state-metrics:
  #set enabled to false to disable this app
  enabled: true
  # Annotations to be added to the pod
  podAnnotations:
    prometheus.io/scrape: 'true' #autoscrape this
    prometheus.io/port: '8080'



grafana:
  #set enabled to false to disable this app
  enabled: true
  service:
    enabled: true
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ## Pod Annotations
  podAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3000'
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: true
    # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
    # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
    # ingressClassName: nginx
    # Values can be templated
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    path: /

    hosts:
      - grafana.local

    tls:
      - secretName: grafana-cert
        hosts:
          - grafana.local

  ## Sidecars that collect the configmaps with specified label and stores the included files them into the respective folders
  ## Requires at least Grafana 5 to work and can't be used together with parameters dashboardProviders, datasources and dashboards
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

# victoria-metrics-agent:
#   enabled: 

# List of external tools to enable Grafana dashboards for (see templates/dashboards/*.yaml).
# Add/remove entries to turn a component's dashboard on/off; anything not listed is disabled.
# Supported values: ingressController, certManager, externalDNS
# The underlying scrape jobs and alert rules are always defined but self-gating: they simply find
# no targets/never fire if the component isn't installed, matching this chart's existing convention
# for other optional components (e.g. MySQL/PostgreSQL/Vault alerts).
externalToolsMonitoring: []

node-exporter:
  enabled: false

prometheus-blackbox-exporter:
  enabled: false

karma:
  enabled: false
  ingress:
    enabled: false
    annotations: {}
    host: karma.local

loki:
  enabled: false
  loki:
    compactor:
      compaction_interval: 10m
      delete_request_store: filesystem
      retention_delete_delay: 1h
      retention_delete_worker_count: 50
      retention_enabled: true
      working_directory: /var/loki/compactor
    limits_config:
        retention_period: 720h
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  minio:
    enabled: true
  gateway:
    ingress:
      enabled: true
      annotations: {}
      hosts:
        - host: loki.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: loki-gateway-tls
          hosts:
            - loki.local
# In case you have loki installed somewhere manually or with ccxdeps helm chart, set the following variable to your hostname.
# Make sure that X-Scope-OrgID header is set with value "ccx"
# lokiHostname: 


victoria-metrics-cluster:
  enabled: false
  vmselect:
    resources:
      limits:
        cpu: 500m
        memory: 1000Mi
      requests:
        cpu: 50m
        memory: 64Mi
  vmstorage:
    persistentVolume:
      size: 100Gi
    resources: 
      limits:
        cpu: 2000m
        memory: 3072Mi
      requests:
        cpu: 500m
        memory: 512Mi
    horizontalPodAutoscaler:
      enabled: true
      maxReplicas: 3
      minReplicas: 2
      metrics: 
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 75
      behavior:
        scaleDown:
          selectPolicy: Disabled

victoria-metrics-agent:
  enabled: false
  remoteWrite: 
  - url: "http://observability-victoria-metrics-cluster-vminsert.observability.svc.cluster.local:8480/insert/0/prometheus/"
  service:
    enabled: true
    servicePort: 9090
  # resource:
  #   limits:
  #     cpu: 2000m
  #     memory: 6000Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  persistentVolume:
    enabled: true
  horizontalPodAutoscaling:
    maxReplicas: 3
  config:
    global:
      scrape_interval: 2m
      external_labels:
        cluster: ccx
        #use_cmon_sd is required DO NOT REMOVE
        use_cmon_sd: true
        #monitor: clustercontrol is required DO NOT REMOVE
        monitor: clustercontrol
